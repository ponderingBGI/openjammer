[package]
name = "ojfaust"
description = "Host-side Faust DSP compilation for OpenJammer: turn Faust source (hand-written or AI-authored in U20) into a loadable DSP node, with an agentic compile->error->repair loop. This crate is a FEATURE-GATED scaffold: with the default (`libfaust` OFF) it is a clear stub that builds without any native dependency; the real backend (the CLI Path B that shells the `faust` binary) ships in the default build; the optional in-process libfaust JIT is gated behind the `libfaust` feature."
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# DEFAULT OFF. The crate must build + clippy clean with NO native toolchain.
#
# With `libfaust` OFF:
#   - `FaustCompiler::compile` returns `FaustError::Unavailable`.
#   - the agentic `compile_repair` loop is fully present (pure control flow);
#     it bottoms out on `Unavailable` only when the `faust` binary is not on PATH.
#
# With `libfaust` ON (cannot be verified in this environment — see README):
#   - selects the in-process libfaust C-API JIT (Path A). That JIT binding is
#     not yet implemented and reports Unavailable until it is; the `faust` CLI
#     path (Path B) is the implemented default backend.
default = []
libfaust = ["dep:libc"]

[dependencies]
# Host crate (std): this is off-RT-thread compilation tooling, NOT the audio
# kernel, so it does not need `no_std`.
#
# `serde_json` parses the `faust -json` metadata (name/inputs/outputs/ui params)
# for the default CLI-backed Path B. It is PURE RUST (no native toolchain), the
# SAME crate oj-tauri already pins, so the default build still needs no native
# dependency — only the `libfaust` feature pulls a native lib.
serde_json = "1.0.150"

# `libc` is only pulled in when the native backend is enabled, so the default
# stub build has ZERO third-party native dependencies.
libc = { version = "0.2.180", optional = true }

# NOTE: when the libfaust C-API binding path is chosen, add the build-time
# bindgen dependency here as well, e.g.:
#   [build-dependencies]
#   bindgen = "0.71"
# It is intentionally omitted from the default scaffold so `cargo build`
# pulls nothing and needs no `build.rs`.
