[package]
name = "ojhost"
description = "Third-party plugin host for OpenJammer (UNIT U-JUCE). Scans for and hosts VST3 / CLAP (AU on macOS) plugins behind ojcore's `DspInstance` trait, so a hosted plugin is just another node (\"everything is a plugin\"). NATIVE-ONLY (never wasm). All C++ is confined to this crate boundary; the rest of OpenJammer stays Rust. FEATURE-GATED: the default build is a dependency-free scaffold (scan returns empty, load is Unavailable); the real backends sit behind the `clap-host` (clack, pure Rust, MIT) and `juce` (bundled C++ JUCE 8 via CMake) features."
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# DEFAULT OFF on both backends. The crate MUST build + clippy clean + test
# green with NO native toolchain and NO network — the scaffold path. This is
# the same posture as `ojfaust`: the API shape, descriptor marshalling, scan
# cache + crash-blacklist, and the `PluginHostNode: DspInstance` bridge are all
# fully present and unit-tested; only the *backend that actually opens a plugin*
# is gated.
#
#   cargo build  -p ojhost                      -> scaffold (no real hosting)
#   cargo build  -p ojhost --features clap-host -> real CLAP hosting via clack
#   cargo build  -p ojhost --features juce      -> JUCE C++ host (VST3/CLAP/AU)
default = []

# Pure-Rust CLAP host via the `clack` family (MIT, no C++). This is the
# recommended path to host a real plugin in this sandbox: no CMake, no JUCE
# checkout. Supports CLAP only.
clap-host = ["dep:clack-host", "dep:clack-extensions"]

# The JUCE 8 C++ host (VST3 + CLAP, + AU on macOS). Pulls JUCE via CMake
# FetchContent in `build.rs` and links the small `extern "C"` shim in `cpp/`.
# Heavy (downloads + compiles JUCE); requires `cmake` + a C++ toolchain (and,
# for VST3, the Steinberg VST3 SDK headers — see README). Off by default so the
# default build needs none of that.
juce = ["dep:cmake"]

# NOTE on the dev/test crash-boundary harness: it is gated on the ENV VAR
# `OJHOST_FAULT_INJECT=1` (read by build.rs), NOT a cargo feature. A feature would
# be a new feature-combo → a SECOND full JUCE FetchContent clone + rebuild (~1 GB,
# minutes) just to flip one `#ifdef`; the env var keeps the `{juce}` feature set so
# the existing JUCE build is reused and only `ojhost_juce.cpp` recompiles. build.rs
# emits `--cfg oj_fault_inject` when the var is set, so the Rust + C++ sides agree.
# See `crates/ojhost/build.rs` and `cpp/ojhost_juce.cpp`.

[dependencies]
# Engine ABI: a hosted plugin is a `DspInstance` minted by a `PluginLoader`
# registered under `PrimitiveKind::PluginHost`. `default-features = false`
# keeps us off ojcore's std-only RT plumbing we do not need here.
ojcore = { path = "../ojcore", default-features = false }
ojproto = { path = "../ojproto" }
serde = { workspace = true, features = ["std"] }
# JSON for the on-disk scan cache. Runtime dep (not dev-only): the cache
# round-trips through `scan_with` in normal use.
serde_json = "1.0.150"

# Pure-Rust CLAP host (MIT). Only linked with `--features clap-host`. Pinned
# from a fresh `cargo add` resolve (governing principle #9).
clack-host = { version = "0.1.0", optional = true }
# CLAP params + state extensions: query a plugin's parameter list (id/name/range)
# at scan so the UI shows real knobs and drive values via core param events; and
# save/restore the plugin's opaque state (the `oj.state` capability — host-managed
# binary streams) so a project reopens with its CLAP plugins restored. Same
# pure-Rust clack family (MIT); only linked with `--features clap-host`.
clack-extensions = { version = "0.1.0", optional = true, features = ["clack-host", "params", "state"] }

[dev-dependencies]
# CodSpeed-compatible criterion: plain criterion locally, instruction-count +
# allocation instrumented in CI. Benchmarks the hosted-plugin control plane that
# must stay off-RT but still instant for live use (scan cache, ids, registration).
codspeed-criterion-compat = "4.7.0"
# clack PLUGIN side (MIT) — test-only. Lets the CLAP-state round-trip test define an
# IN-PROCESS clack plugin (no `.clap` dylib, no audio device) so CI verifies the
# real `clap_plugin_state` save/load against `ClapBackend`. Only compiled for tests;
# the state test itself is gated to the `clap-host` cfg (where `clap.rs` exists).
clack-plugin = "0.1.0"

# clack-extensions PLUGIN side (test-only): the `clack-plugin` feature exposes
# `PluginStateImpl` so the in-process state stub can implement the CLAP state
# extension. Unifies with the normal (`clack-host`) optional dep for the clap-host
# test build; harmless (plugin-side only) when clap-host is off.
[dev-dependencies.clack-extensions]
version = "0.1.0"
features = ["clack-plugin", "state"]

# clack-host with its `clack-plugin` feature (test-only): exposes
# `PluginEntry::load_from_clack`, which loads an IN-PROCESS clack plugin (no dylib).
# Unifies with the normal optional clack-host dep for the clap-host test build.
[dev-dependencies.clack-host]
version = "0.1.0"
features = ["clack-plugin"]

[[bench]]
name = "hosting"
harness = false

[build-dependencies]
# Drives the CMake build of the bundled C++ JUCE host. Only used with
# `--features juce`; the default build pulls no build dependency at all.
cmake = { version = "0.1.58", optional = true }
