[package]
name = "ojproto"
description = "OpenJammer UI<->engine wire protocol and OjGraph IR. Control-rate ONLY: no audio sample buffers ever cross this boundary."
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }

[dev-dependencies]
# Used ONLY by tests/wire_shapes.rs to pin the exact JSON wire format that the
# hand-written TS mirror in packages/oj-protocol-ts depends on. Pulls in std
# (fine: tests are built with std).
serde_json = "1.0"
# Property-based testing on-ramp (Track A P0a). Tests link std, so a no_std crate
# can still use proptest as a dev-dependency. Drives the codec round-trip in
# tests/proptest_codec.rs; the OjGraph/compile() generators that reuse these
# strategies (cycle-rejection, valid Kahn order, never-panics) are the next step.
proptest = "1"
# CodSpeed-compatible criterion: plain criterion locally, instruction-count +
# allocation instrumented in CI. Benches the control-plane serialization path
# (OjGraph push, ParamPatch frame, RtCommand) in benches/codec.rs.
codspeed-criterion-compat = "5.0.1"

[[bench]]
name = "codec"
harness = false
