[package]
name = "ojcore"
description = "OpenJammer plugin/extensibility ABI: one PluginManifest + one CLAP-shaped DspInstance runtime trait that built-in DSP, Faust, AI-WASM, and hosted plugins all implement (\"everything is a plugin\"). no_std + alloc."
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
# `std` pulls in the host-side RT plumbing (command ring + graph hot-swap) that
# needs OS threads/atomics beyond bare `alloc`. The compile/exec engine core and
# the ABI stay `no_std` so they compile unchanged for the `wasm32` AudioWorklet:
#   cargo build -p ojcore --no-default-features  ->  no_std core only.
default = ["std"]
std = ["dep:rtrb", "dep:basedrop", "dep:arc-swap"]

[dependencies]
ojproto = { path = "../ojproto" }
ojcore-dsp = { path = "../ojcore-dsp" }
ojcore-midiring = { path = "../ojcore-midiring" }   # zero-dep no_std SPSC byte ring (meter return ring)
serde = { workspace = true }
libm = { workspace = true }                          # no_std sqrt for RMS metering

# std-only RT host plumbing (versions pinned from a fresh `cargo add` resolve).
rtrb = { version = "0.3.4", optional = true }       # wait-free SPSC ring (command queue)
basedrop = { version = "0.1.3", optional = true }   # deferred, RT-safe drop of the old program
arc-swap = { version = "1.9.1", optional = true }   # lock-free atomic program publish/read

[dev-dependencies]
assert_no_alloc = "1.1.2"                            # proves the hot loop allocates zero bytes
proptest = "1"                                        # property tests over compile() (Track A P0a)
# CodSpeed-compatible criterion: runs as plain criterion locally (`cargo bench`)
# and is instrumented for instruction-count measurement by the CodSpeed CI action
# (Track A P1 — perf-regression gate on the hot paths).
codspeed-criterion-compat = "5.0.1"

[[bench]]
name = "engine"
harness = false
