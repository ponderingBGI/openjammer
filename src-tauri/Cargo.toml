[package]
name = "oj-tauri"
description = "OpenJammer native desktop shell (Tauri v2). Hosts the existing Vite web UI as the frontend and the native <5ms ojcore engine (ojcore-native AudioHost) as the realtime backend. Control-rate Tauri commands bridge the UI to the RT command ring + graph hot-swap."
edition.workspace = true
version.workspace = true
license.workspace = true

# The desktop binary entry point lives in `src/main.rs`; the shared app wiring
# lives in `src/lib.rs` (the Tauri convention, so a mobile leg could reuse it).
# The library name is distinct from the binary so `cargo build -p oj-tauri`
# compiles both without a name clash.
[lib]
name = "oj_tauri_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "openjammer"
path = "src/main.rs"

[build-dependencies]
# Pinned from a fresh `cargo search` at scaffold time (governing principle #9).
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
# --- the native OpenJammer engine (this is the whole point of the unit) ------
# `ojcore` (std) gives us compile/Engine/PluginRegistry/CommandQueue/ProgramSwap;
# `ojcore-native` owns the cpal AudioHost; `ojinstrument` ships the Osc/Sampler/
# Karplus loaders; `ojproto` is the control-rate IR/command wire type.
ojcore = { path = "../crates/ojcore" }
# `persist` turns on the L3 SQLite/FTS5 local log store (bundled SQLite, no system
# dep). The shell wires it into the off-RT event drain as the queryable durable
# local tail (the NDJSON remains the post-crash SSOT). LOCAL-ONLY, never network,
# and fed ONLY off the audio thread (the control-side `drain_events`).
ojcore-native = { path = "../crates/ojcore-native", features = ["persist"] }
ojinstrument = { path = "../crates/ojinstrument" }
ojproto = { path = "../crates/ojproto" }

# --- third-party plugin host (U-JUCE) ----------------------------------------
# Scans for and hosts VST3 / CLAP (+ AU on macOS) plugins as ojcore nodes.
# NATIVE-ONLY. Default features = scaffold (scan returns empty, no native deps);
# enable real hosting with `--features ojhost/clap-host` (pure-Rust CLAP) or
# `--features ojhost/juce` (bundled C++ JUCE 8) — see crates/ojhost/README.md.
ojhost = { path = "../crates/ojhost" }

# --- AI DSP-node authoring (U20) ---------------------------------------------
# Host-side Faust compilation behind the AI agent's `author_dsp_node` tool.
# Default build is a dependency-free stub (`compile` -> Unavailable); enable real
# compilation with `--features ojfaust/libfaust` once libfaust is installed
# (see crates/ojfaust/README.md). NEVER on the realtime path.
ojfaust = { path = "../crates/ojfaust" }

# --- AI code-node EXECUTION host (M6) ----------------------------------------
# Runs AI-authored faust code nodes natively: `native-host` compiles faust to a
# .dll (faust -lang cpp -> cl.exe) and drives it via libloading behind ojcore's
# DspInstance, with the permanent OutputGuard chain. (The wasmtime `oj_*` sandbox
# path is also in this crate but unused here — faust's wasm needs an exception
# proposal wasmtime can't run; see docs/code-node-abi.md.) NATIVE-ONLY.
ojwasm = { path = "../crates/ojwasm", features = ["native-host"] }

# --- the Tauri v2 shell ------------------------------------------------------
tauri = { version = "2.11.2", features = [] }
tauri-plugin-opener = "2.5.4"

# JSON (de)serialization for the control-rate IPC boundary (OjGraph / RtCommand
# travel as JSON across `invoke`). Pin to the workspace serde + a fresh serde_json.
serde = { workspace = true, features = ["std"] }
serde_json = "1.0.150"

# --- off-RT structured logging (L1) ------------------------------------------
# The shell brings up the `tracing` NDJSON sink (`ojcore_native::init_logging`)
# and routes a panic hook through it. STD-only, OFF the audio thread — the audio
# callback owns the engine inside cpal and has no `tracing` dependency, so a
# `tracing::*` call there cannot compile. `tracing-appender` is needed only to
# name the `WorkerGuard` flush-guard parked in managed state.
tracing = { workspace = true }
tracing-appender = { workspace = true }

[features]
# This feature must be enabled when building the app in production, so the
# webview loads the bundled frontend instead of the dev server. Tauri's CLI sets
# it via `tauri build`; harmless in `cargo build`.
custom-protocol = ["tauri/custom-protocol"]

# --- scoped panic guard (Phase 4) --------------------------------------------
# `unwrap()`/`expect()` panic the WHOLE app — on stage that is a dead set, not a
# recoverable glitch. So the desktop shell, where the audited panic risk lives
# (subprocess spawn, IPC, env, fs), must surface a `Result`/honest fallback
# instead. This deny is DELIBERATELY scoped to `oj-tauri` ONLY and is NEVER
# promoted workspace-wide: the no_std DSP crates (`ojcore`, `ojcore-dsp`, …) are
# full of legitimate INFALLIBLE unwraps on compile-time-proven invariants, and a
# workspace deny would push silent `.unwrap_or(default)` fallbacks into the audio
# path — a lie told to the performer's hands (code-values #4/#6). Tests are
# exempt (their `unwrap`/`expect` IS the assertion); a handful of production sites
# whose precondition is a build-time invariant carry a justified, documented
# `#[allow(clippy::expect_used)]` at the call site.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

# --- Windows process hygiene (Phase 4) ---------------------------------------
# Job Object APIs so the Pi agent child is reaped WHOLE-TREE on kill/drop (a bare
# `Child::kill()` orphans descendants on Windows). Win-only; the same crate Tauri
# already pulls transitively (no new toolchain). CONTROL-PLANE only, never on the
# audio RT path. `CREATE_NO_WINDOW` itself needs no crate (it's in `std`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

# --- native auto-updater (R2/R4) ---------------------------------------------
# Win + Linux ONLY. macOS is intentionally excluded: without an Apple Developer
# ID + notarization Gatekeeper quarantines a swapped `.app`, so the macOS updater
# stays compiled-off and Mac ships a manual `.dmg` (OWNER-PROVISIONING.md §4).
# The download-complete path hands off to `ojcore_native::UpdateGate` so an
# install never swaps the binary out from under live audio (a held note beats a
# glitch). Owner-enabled: needs the split stable/canary minisign keys + the
# update endpoints (OWNER-PROVISIONING.md §3) before it does anything.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
semver = "1.0.28"
tauri-plugin-updater = "2.10.1"
url = "2.5.8"
