<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenJammer</title>
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/outfit-variable.woff2" />
    <style>
      :root {
        --oj-boot-paper: #F4F3F0;
        --oj-boot-panel: #FAF9F6;
        --oj-boot-ink: #1D1C18;
        --oj-boot-muted: #5A5850;
        --oj-boot-node: #FFFFFF;
        --oj-boot-accent: oklch(0.66 0.19 40);
        --oj-boot-line: #E3E1DA;
        --oj-boot-line-strong: #C8C5BB;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        color: var(--oj-boot-ink);
        background: var(--oj-boot-paper);
        font-family: 'Outfit', system-ui, 'Segoe UI', -apple-system, sans-serif;
      }

      #root {
        background-color: var(--oj-boot-paper);
        background-image: radial-gradient(circle, rgba(0, 0, 0, 0.06) 1px, transparent 1px);
        background-size: 24px 24px;
      }

      .oj-boot {
        min-height: 100%;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }

      .oj-boot-card {
        width: min(480px, 100%);
        box-sizing: border-box;
        padding: 28px 32px;
        border: 1px solid var(--oj-boot-line);
        border-radius: 20px;
        background: var(--oj-boot-node);
        box-shadow: 0 2px 6px rgba(24,22,16,.07), 0 12px 28px rgba(24,22,16,.11);
      }

      .oj-boot-title {
        margin: 0 0 8px;
        font-family: 'Outfit', system-ui, 'Segoe UI', -apple-system, sans-serif;
        font-size: 36px;
        line-height: 1.1;
      }

      .oj-boot-copy {
        margin: 0;
        color: var(--oj-boot-muted);
        font-size: 15px;
        line-height: 1.5;
      }

      .oj-boot-steps {
        display: grid;
        gap: 8px;
        margin: 20px 0 0;
        padding: 0;
        list-style: none;
        font-size: 14px;
      }

      .oj-boot-steps li {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .oj-boot-steps li::before {
        content: "";
        width: 10px;
        height: 10px;
        flex: 0 0 auto;
        border: 1px solid var(--oj-boot-line-strong);
        border-radius: 50%;
        background: var(--oj-boot-accent);
        animation: oj-boot-pulse 1.2s ease-in-out infinite;
      }

      .oj-boot-steps li:nth-child(2)::before {
        animation-delay: 0.18s;
      }

      .oj-boot-steps li:nth-child(3)::before {
        animation-delay: 0.36s;
      }

      .oj-boot-hint {
        margin-top: 18px;
        padding-top: 14px;
        border-top: 1px solid var(--oj-boot-panel);
        color: var(--oj-boot-muted);
        font-size: 13px;
        line-height: 1.45;
      }

      @keyframes oj-boot-pulse {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-2px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .oj-boot-steps li::before {
          animation: none;
        }
      }
    </style>
    <script>
      try{if(localStorage['openjammer-theme']==='dark'){let s=document.documentElement.style;s.setProperty('--oj-boot-paper','#161510');s.setProperty('--oj-boot-panel','#242219');s.setProperty('--oj-boot-ink','#F1EFE8');s.setProperty('--oj-boot-muted','#ABA89C');s.setProperty('--oj-boot-node','#201F19');s.setProperty('--oj-boot-accent','oklch(0.72 0.19 40)');s.setProperty('--oj-boot-line','#33312A');s.setProperty('--oj-boot-line-strong','#4B473D');s.setProperty('--bg-canvas','#161510')}}catch{}
    </script>
  </head>
  <body>
    <div id="root">
      <main class="oj-boot" role="status" aria-live="polite">
        <section class="oj-boot-card" aria-label="OpenJammer is starting">
          <h1 class="oj-boot-title">OpenJammer</h1>
          <p class="oj-boot-copy">Getting the studio ready. Three questions and you&rsquo;ll be playing.</p>
          <ul class="oj-boot-steps" aria-label="Startup checks">
            <li>Loading the canvas</li>
            <li>Warming the audio engine</li>
            <li>Wiring your rig</li>
          </ul>
          <p class="oj-boot-hint">
            If this stays here in dev, check the terminal for the first Vite or Rust error.
          </p>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
