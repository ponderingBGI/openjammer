# clippy.toml — DSP floating-point determinism guard (plan §4.1; the policy is
# documented at the docs site /reference/floating-point/).
#
# The SAME Rust DSP must produce the same audio natively and compiled to wasm.
# std's transcendental functions dispatch to the platform libm, whose results
# differ bit-for-bit across OS/arch — so the engine routes EVERY transcendental
# through the `libm` crate (one implementation everywhere). This guard turns a
# std transcendental METHOD call into a clippy error (the CI clippy runs with
# `-D warnings`), so the libm-only discipline can't silently regress.
#
# NOT banned: `sqrt` (IEEE-754 correctly-rounded → deterministic across
# platforms) and ordinary arithmetic. Non-DSP reference/test code that wants a
# std transcendental opts out locally with `#[allow(clippy::disallowed_methods)]`.

# Test-code exemption for the `oj-tauri` scoped panic guard (Phase 4). That crate
# sets `[lints.clippy] unwrap_used/expect_used = "deny"` so a panic can't slip into
# the stage path. But CI runs `clippy --workspace --all-targets`, which lints test
# targets with `cfg(test)` TRUE — and in a test an `unwrap()`/`expect()` IS the
# assertion. These two keys exempt every `#[cfg(test)]` block workspace-wide, so the
# deny fires only on production code (its intent) and the required CI clippy gate
# stays green. clippy.toml is per-workspace, so this is the only place to set them.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

disallowed-methods = [
  { path = "f32::sin",        reason = "use libm::sinf for cross-platform-deterministic DSP" },
  { path = "f64::sin",        reason = "use libm::sin for cross-platform-deterministic DSP" },
  { path = "f32::cos",        reason = "use libm::cosf" },
  { path = "f64::cos",        reason = "use libm::cos" },
  { path = "f32::tan",        reason = "use libm::tanf" },
  { path = "f64::tan",        reason = "use libm::tan" },
  { path = "f32::asin",       reason = "use libm::asinf" },
  { path = "f64::asin",       reason = "use libm::asin" },
  { path = "f32::acos",       reason = "use libm::acosf" },
  { path = "f64::acos",       reason = "use libm::acos" },
  { path = "f32::atan",       reason = "use libm::atanf" },
  { path = "f64::atan",       reason = "use libm::atan" },
  { path = "f32::atan2",      reason = "use libm::atan2f" },
  { path = "f64::atan2",      reason = "use libm::atan2" },
  { path = "f32::sinh",       reason = "use libm::sinhf" },
  { path = "f64::sinh",       reason = "use libm::sinh" },
  { path = "f32::cosh",       reason = "use libm::coshf" },
  { path = "f64::cosh",       reason = "use libm::cosh" },
  { path = "f32::tanh",       reason = "use libm::tanhf" },
  { path = "f64::tanh",       reason = "use libm::tanh" },
  { path = "f32::exp",        reason = "use libm::expf" },
  { path = "f64::exp",        reason = "use libm::exp" },
  { path = "f32::exp2",       reason = "use libm::exp2f" },
  { path = "f64::exp2",       reason = "use libm::exp2" },
  { path = "f32::ln",         reason = "use libm::logf" },
  { path = "f64::ln",         reason = "use libm::log" },
  { path = "f32::log2",       reason = "use libm::log2f" },
  { path = "f64::log2",       reason = "use libm::log2" },
  { path = "f32::log10",      reason = "use libm::log10f" },
  { path = "f64::log10",      reason = "use libm::log10" },
  { path = "f32::powf",       reason = "use libm::powf" },
  { path = "f64::powf",       reason = "use libm::pow" },
  { path = "f32::cbrt",       reason = "use libm::cbrtf" },
  { path = "f64::cbrt",       reason = "use libm::cbrt" },
  { path = "f32::hypot",      reason = "use libm::hypotf" },
  { path = "f64::hypot",      reason = "use libm::hypot" },
]
