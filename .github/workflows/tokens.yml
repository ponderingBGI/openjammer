# Design tokens — rebuilt for you, never by hand.
#
# Nobody should have to remember `bun run tokens`. When a PR changes the DTCG sources
# (or any generated token artifact), this regenerates ALL of them and commits the result
# straight back onto the PR branch — so an edit to packages/oj-tokens/tokens/ "just works",
# with the compiled CSS/TS landing in the same PR automatically.
#
# Same-repo branches get the auto-commit. Fork PRs can't be pushed to with the default
# token, so there we fall back to a hard drift check that tells the contributor to run
# `bun run tokens` (rare for this team; forks don't get write access by design).
name: Tokens

on:
  pull_request:
    paths:
      - 'packages/oj-tokens/**'
      - 'packages/oj-ui/oj-tokens.css'

permissions:
  contents: write

concurrency:
  group: tokens-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the PR's head branch (not the merge ref) so we can push back.
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ github.token }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install (root toolchain — style-dictionary)
        run: bun install --frozen-lockfile

      - name: Rebuild every token artifact from the DTCG
        run: bun run tokens

      - name: Auto-commit the rebuild (same-repo) or fail with guidance (fork)
        env:
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          if git diff --quiet; then
            echo "Token artifacts already match the DTCG — nothing to rebuild."
            exit 0
          fi
          echo "Token artifacts were stale; the DTCG rebuild produced changes:"
          git --no-pager diff --stat
          if [ "$IS_FORK" = "true" ]; then
            echo "::error::This PR is from a fork, so CI can't push the rebuild. Run 'bun run tokens' locally and commit the result."
            exit 1
          fi
          git config user.name "openjammer-bot"
          git config user.email "bot@users.noreply.github.com"
          git add packages/oj-tokens/dist/variables.css \
                  packages/oj-tokens/src/generated/themes.ts \
                  packages/oj-ui/oj-tokens.css
          git commit -m "chore(tokens): auto-rebuild from DTCG [skip ci]"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "Pushed the rebuilt token artifacts to this PR."
