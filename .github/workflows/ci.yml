name: CI

# Merge gate for OpenJammer (ojcore rewrite). Must be green for a reliable
# merge to main: the Rust engine workspace (native + no_std + wasm legs) and the
# TypeScript control plane (typecheck + tests + production build).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Least privilege (zizmor excessive-permissions): every job here only reads the
# repo. The deploy-style writes (Pages, releases) live in their own workflows.
permissions:
  contents: read

jobs:
  engine:
    name: Engine (Rust workspace)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: System deps (ALSA for cpal + GTK/WebKit for the Tauri crate)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev
      # Install nightly FIRST (only the wasm leg uses `cargo +nightly`), then
      # stable LAST so stable is the DEFAULT toolchain for fmt/clippy/test/build
      # (otherwise `cargo fmt` runs on nightly, which has no rustfmt component).
      - name: Rust nightly (wasm leg)
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2  # nightly
        with:
          toolchain: nightly   # required: the ref is SHA-pinned, so the toolchain can no longer be inferred from the @tag
          components: rust-src
          targets: wasm32-unknown-unknown
      - name: Rust stable (default; fmt, clippy)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable   # required: the ref is SHA-pinned
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: RT event-emit no-alloc gate (devlog)
        # Dedicated assert_no_alloc proof that `event_frame::emit` never
        # allocates on the audio thread. Gated behind the `devlog` feature so it
        # is OFF in shipping builds and runs only in this explicit CI step.
        run: cargo test -p ojcore --features devlog
      - name: no_std core builds (wasm-friendly)
        run: cargo build -p ojcore --no-default-features
      - name: wasm32 build
        run: cargo +nightly build -p ojcore-wasm --target wasm32-unknown-unknown -Z build-std=std,panic_abort
      - name: Offline audio render gate (device-free)
        # Renders a real arpeggio (Osc->Biquad->Delay->Speaker) to a WAV and
        # asserts the output is finite, non-silent, and in a sane RMS band — so
        # CI verifies the engine actually produces correct audio, no device needed.
        run: |
          cargo clippy -p ojcore-native --features demo --all-targets -- -D warnings
          cargo run -p ojcore-native --bin render --features demo -- "${RUNNER_TEMP:-/tmp}/ci-render.wav" 2
      - name: Plugin host — real CLAP backend builds + tests
        # The DEFAULT `ojhost` build is a dependency-free scaffold (scan empty,
        # load Unavailable), so the workspace clippy/test above don't exercise the
        # real hosting code. This compiles, lints, and tests the REAL pure-Rust
        # CLAP backend (clack, MIT — no C++/CMake) so the plugin-host path stays
        # green on every commit. The JUCE VST3/AU backend (`--features juce`) needs
        # CMake + a C++ toolchain + the VST3 SDK and is built on the founder's rig.
        run: |
          cargo clippy -p ojhost --features clap-host --all-targets -- -D warnings
          cargo test -p ojhost --features clap-host

  web:
    name: Web (control plane)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test:run
      - name: Build
        run: bun run build

  windows-native:
    name: Windows native build + audio gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable   # required: the ref is SHA-pinned
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: ". -> target"
      - name: Install frontend deps
        run: bun install --frozen-lockfile
      - name: Build the native desktop app (oj-tauri)
        run: cargo build -p oj-tauri
      - name: Engine tests on Windows
        run: cargo test -p ojcore -p ojinstrument -p ojcore-native
      - name: Offline audio render gate (Windows, device-free)
        run: cargo run -p ojcore-native --bin render --features demo -- ci-render.wav 2

  macos-native:
    name: macOS native build + audio gate (aarch64)
    # The maintainer's primary box is Windows; macOS is the most fragile-toolchain
    # OS, so it earns a PER-PR leg (not nightly-only) — and `macos-latest` is
    # Apple-silicon (aarch64), giving the per-arch DSP golden coverage T2 wants
    # (the device-free render + tolerance-banded golden tests run headless here,
    # so an FMA-contraction / ULP drift on aarch64 surfaces on every PR).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable   # required: the ref is SHA-pinned
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: ". -> target"
      - name: Install frontend deps
        run: bun install --frozen-lockfile
      - name: Build the native desktop app (oj-tauri)
        run: cargo build -p oj-tauri
      - name: Engine tests on macOS (aarch64)
        run: cargo test -p ojcore -p ojinstrument -p ojcore-native
      - name: Offline audio render gate (macOS, device-free)
        run: cargo run -p ojcore-native --bin render --features demo -- "${RUNNER_TEMP:-/tmp}/ci-render.wav" 2

  credential-scan:
    name: Credential scan
    # REQUIRED (plan §0.5): the founder is Windows-only, so the local pre-commit
    # hook cannot be the only guard against a committed signing key — this runs in
    # Actions on every PR. Scans the whole tracked tree for secret-filename globs
    # (*.key/*.pem/*.p12/*.pfx/*.minisign, .tauri/) and PEM private-key blocks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - name: Install
        run: bun install --frozen-lockfile
      - name: Scan tree for committed signing keys / secrets
        run: bun run scripts/oj/index.ts doctor --check credentials

  zizmor:
    name: zizmor (workflow security audit)
    # REQUIRED (plan §0.5): static security audit of every workflow — most
    # importantly it FAILS on any un-SHA-pinned third-party action (a key-
    # exfiltration path once signing secrets are added), plus excessive
    # permissions, credential persistence, and template-injection. Pinned to the
    # zizmor version this tree is clean against; `--offline` runs the static
    # audits without needing a token.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - name: Audit workflows
        run: uvx zizmor@1.25.2 --offline .github/workflows/

  # ── The SINGLE required status check (foundation F6) ───────────────────────
  # Branch protection binds the string "Merge gate"; everything else funnels in
  # here as a `need`, never as an independently-required check. DO NOT RENAME.
  gate:
    name: Merge gate
    needs: [engine, web, windows-native, macos-native, credential-scan, zizmor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate aggregate result
        # The gate predicate (plan doc 05 §5): FAIL unless every `need` is in
        # {success, skipped}. A `skipped` need is a legitimately-conditional job;
        # any `failure`/`cancelled` red-walls the merge.
        run: |
          results='${{ join(needs.*.result, ',') }}'
          echo "needs results: $results"
          case ",$results," in
            *",failure,"*)   echo "::error::a required job failed";    exit 1 ;;
            *",cancelled,"*) echo "::error::a required job was cancelled"; exit 1 ;;
          esac
          echo "All required jobs passed (success or legitimately skipped)."
