name: CI

# Merge gate for OpenJammer (ojcore rewrite). Must be green for a reliable
# merge to main: the Rust engine workspace (native + no_std + wasm legs) and the
# TypeScript control plane (typecheck + tests + production build).
#
# Lane A (per-PR): an affected-selection `changes` job reads `oj plan --json` and
# runs only the legs a PR actually touches. Non-PR events (push to main/canari,
# manual dispatch) run EVERYTHING. The aggregate `gate` job is the single
# required check: it passes when every needed job is success-or-skipped and fails
# if any failed — so skipping an unaffected leg never weakens the gate.
#
# The repeated checkout/apt/toolchain/cache/bun blocks are collapsed into the
# `setup-rust` + `setup-web` composite actions (.github/actions/*).

on:
  push:
    branches: [main, canari]
  pull_request:
    branches: [main, canari]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Affected selection
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.plan.outputs.engine }}
      web: ${{ steps.plan.outputs.web }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # history needed to diff against the base
      - name: Setup web (Bun + install)
        uses: ./.github/actions/setup-web
      - id: plan
        name: Compute affected legs (oj plan)
        shell: bash
        run: |
          # FAIL CLOSED: the affected-selection may only ever run a SUPERSET of the
          # legs a change needs, never skip one — so a green PR guarantees a green
          # push to canari. We run the FULL gate unless `oj plan` is provably
          # trustworthy (parsed, real non-empty diff, every file recognized).
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR event -> full run."
            exit 0
          fi

          # Make the PR base available at FULL depth. NEVER shallow-fetch (`--depth`)
          # here: a shallow base makes the `ref...HEAD` merge-base diff fail, which
          # silently yields an EMPTY changeset and skips every affected leg (the bug
          # that let a broken e2e test merge). The checkout above used fetch-depth: 0,
          # so the base is present; this just refreshes it without shallowing.
          git fetch --no-tags origin "${{ github.base_ref }}" || true

          # Diff against the ACTUAL PR base (origin/<base_ref>), NOT oj plan's local
          # default of origin/main.
          plan="$(bun scripts/oj/index.ts plan --json --base "origin/${{ github.base_ref }}" 2>/dev/null)" || plan=""
          echo "oj plan: ${plan:-<empty>}"

          ok="$(jq -r '.ok // false' <<<"$plan" 2>/dev/null || echo false)"
          changed="$(jq -r '.changedCount // 0' <<<"$plan" 2>/dev/null || echo 0)"
          unrec="$(jq -r '.unrecognizedCount // 1' <<<"$plan" 2>/dev/null || echo 1)"
          recipes="$(jq -r '(.recipes // []) | join(" ")' <<<"$plan" 2>/dev/null || echo "")"

          # Trustworthy ONLY when it parsed (ok), saw a real non-empty diff, and
          # recognized EVERY changed file (mapped to a leg, or known CI-irrelevant).
          # Anything else -> run the full gate.
          if [ "$ok" != "true" ] || [ "${changed:-0}" = "0" ] || [ "${unrec:-1}" != "0" ]; then
            echo "Plan not fully trustworthy (ok=$ok changed=$changed unrecognized=$unrec) -> FULL gate."
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "affected recipes: ${recipes:-<none>}"
          if echo "$recipes" | grep -qE 'fmt|clippy|test|doctest|render|nostd|wasm|clap'; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "engine=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$recipes" | grep -qw 'web'; then
            echo "web=true" >> "$GITHUB_OUTPUT"
          else
            echo "web=false" >> "$GITHUB_OUTPUT"
          fi

  engine:
    name: Engine (Rust workspace)
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Rust (stable + nightly wasm leg)
        uses: ./.github/actions/setup-rust
        with:
          nightly: 'true'
      # The Pi sidecar (`src-tauri/binaries`) is a BUNDLE-only resource, built for
      # real by `bun run build:pi-runtime` inside the release/canary bundling jobs.
      # The cargo gate here compiles oj-tauri but never bundles, so an empty dir
      # satisfies tauri-build's resource-existence check without the heavy build.
      - name: Stage Pi sidecar resource dir (bundle-only)
        shell: bash
        run: mkdir -p src-tauri/binaries
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # RT no-alloc gate (mirrors `just test-rt`). nextest's process-per-test
      # isolation is STRICTLY safer than `cargo test`'s shared process for the
      # global-allocator swap `assert_no_alloc` installs. A REQUIRED per-PR check
      # via the aggregate `gate` — an RT-path heap regression fails the merge.
      - name: Install cargo-nextest (no-alloc gate)
        uses: taiki-e/install-action@9e1e5806d4a4822de933115878265be9aaa786d9 # v2
        with:
          tool: cargo-nextest
      - name: RT no-alloc gate (assert_no_alloc)
        run: cargo nextest run -p ojcore
      - name: no_std core builds (wasm-friendly)
        run: cargo build -p ojcore --no-default-features
      - name: wasm32 build
        run: cargo +nightly build -p ojcore-wasm --target wasm32-unknown-unknown -Z build-std=std,panic_abort
      - name: Offline audio render gate (device-free)
        # Renders a real arpeggio (Osc->Biquad->Delay->Speaker) to a WAV and
        # asserts the output is finite, non-silent, and in a sane RMS band — so
        # CI verifies the engine actually produces correct audio, no device needed.
        run: |
          cargo clippy -p ojcore-native --features demo --all-targets -- -D warnings
          cargo run -p ojcore-native --bin render --features demo -- "${RUNNER_TEMP:-/tmp}/ci-render.wav" 2
      - name: Plugin host — real CLAP backend builds + tests
        # The DEFAULT `ojhost` build is a dependency-free scaffold (scan empty,
        # load Unavailable), so the workspace clippy/test above don't exercise the
        # real hosting code. This compiles, lints, and tests the REAL pure-Rust
        # CLAP backend (clack, MIT — no C++/CMake) so the plugin-host path stays
        # green on every commit. The JUCE VST3/AU backend (`--features juce`) needs
        # CMake + a C++ toolchain + the VST3 SDK and is built on the founder's rig.
        run: |
          cargo clippy -p ojhost --features clap-host --all-targets -- -D warnings
          cargo test -p ojhost --features clap-host

  web:
    name: Web (control plane)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup web (Bun + install)
        uses: ./.github/actions/setup-web
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.app.json
      - name: Lint
        run: bun run lint
      - name: Test
        run: bun run test:run
      # Build-warning gate: the production build must emit ZERO warnings. A clean
      # build is part of the covenant — a chunk-size, browserslist, or deprecation
      # notice is cosmetic noise that erodes trust and, left unchecked, creeps back.
      # We capture the FULL build output (stdout+stderr), then fail if any known
      # warning signature appears. This is fail-closed by signature, not a blanket
      # "any line with 'warn'": we match the specific notices Vite/Rollup/browserslist
      # emit so a legitimate filename containing "warning" can't false-trip it.
      #   - chunk-size .......... "(!) Some chunks are larger than" / "larger than N kB"
      #   - browserslist ........ "Browserslist: browsers data" / "is N months old"
      #   - rollup/vite warns ... lines beginning with "warning" or "(!)"
      #   - deprecations ........ "deprecat" (DEP00xx, "is deprecated", etc.)
      # The build still writes dist/ for the e2e step below.
      - name: Build (zero-warning gate)
        shell: bash
        run: |
          set -o pipefail
          bun run build 2>&1 | tee build.log
          if grep -niE 'Some chunks are larger than|larger than [0-9]+ ?kB|Browserslist: browsers data|caniuse-lite\) is [0-9]+ months? old|months? old\. Please run|^[[:space:]]*\(!\)|^[[:space:]]*warning|deprecat' build.log; then
            echo "::error::Production build emitted a warning (see matched lines above). Fix it honestly — do NOT raise the chunk-size limit or silence browserslist without verifying the data is already at the latest published version."
            exit 1
          fi
          echo "Build emitted zero warnings — gate GREEN."
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Production PWA smoke test
        run: bun run test:e2e

  windows-native:
    name: Windows native build + audio gate
    needs: changes
    # Affected+: the Windows desktop app bundles the web frontend AND links the
    # engine, so it must re-run when EITHER tier is affected. `engine` already
    # subsumes `src-tauri/` changes (they select the fmt/clippy/test recipes ->
    # engine=true in the `changes` job), so engine OR web covers engine, the
    # Tauri shell, and the bundled frontend/IPC surface — closing the gap where a
    # web-only IPC-contract change skipped the costliest runner. Non-PR and
    # untrustworthy diffs set both outputs true (fail-closed), so this still runs
    # everything then and never fires on a docs-only PR.
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.web == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup web (Bun + install)
        uses: ./.github/actions/setup-web
      - name: Setup Rust (stable)
        uses: ./.github/actions/setup-rust
      # Pi sidecar is a bundle-only resource (see the engine job); an empty dir
      # satisfies tauri-build for this non-bundling `cargo build`.
      - name: Stage Pi sidecar resource dir (bundle-only)
        shell: bash
        run: mkdir -p src-tauri/binaries
      - name: Build the native desktop app (oj-tauri)
        run: cargo build -p oj-tauri
      - name: Engine tests on Windows
        run: cargo test -p ojcore -p ojinstrument -p ojcore-native
      - name: Offline audio render gate (Windows, device-free)
        run: cargo run -p ojcore-native --bin render --features demo -- ci-render.wav 2

  doctor:
    name: Doctor wiring gates (fault pipe + COI honesty)
    # Least-privilege: this job only reads the checked-out tree to run pure-TS
    # gates — it needs no write scopes. Set explicitly so it never inherits a
    # broader repository default.
    permissions:
      contents: read
    needs: changes
    # Affected+: the fault-pipe connectivity gate guards the native drain (engine
    # /src-tauri surface) AND the ring ingest (web surface), so it must re-run when
    # EITHER tier is affected. Non-PR and untrustworthy diffs set both true
    # (fail-closed), so this still runs everything then and never fires on a
    # docs-only PR.
    if: needs.changes.outputs.engine == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # This job only reads the tree to run pure-TS gates (no authenticated git
          # ops), so don't persist the token into .git/config — least token surface.
          persist-credentials: false
      - name: Setup web (Bun + install)
        uses: ./.github/actions/setup-web
      # Pure-TS doctor checks only (no Rust toolchain needed): the fault-pipe
      # connectivity gate (poll_events -> ingestEngineEvent must stay wired
      # end-to-end so a silent-dropout regression can never ship green), the
      # PrimitiveKind SSOT set-equality, and the COOP/COEP header presence. A
      # `fail` exits non-zero and blocks the merge; `warn`/`skip` do not.
      - name: Fault pipe wired end-to-end (connectivity gate)
        run: bun scripts/oj/index.ts doctor --check fault-pipe-connectivity --json
      - name: PrimitiveKind SSOT set-equality
        run: bun scripts/oj/index.ts doctor --check ssot-set-equality --json
      - name: COOP/COEP cross-origin isolation headers
        run: bun scripts/oj/index.ts doctor --check coi-headers --json

  gate:
    name: Merge gate
    # The SINGLE required check. Runs always so it can adjudicate skipped legs.
    needs: [changes, engine, web, windows-native, doctor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every needed job to be success-or-skipped
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          echo "needed job results: $RESULTS"
          # Affected-selection legitimately SKIPS unaffected legs; only a real
          # failure or cancellation may block a merge.
          if echo "$RESULTS" | tr ',' '\n' | grep -qE 'failure|cancelled'; then
            echo "::error::A required CI job failed — the merge gate is RED."
            exit 1
          fi
          echo "All required jobs passed or were skipped — merge gate GREEN."
