name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]

# FENCED (plan §0.6): SUGGEST-ONLY. `contents: read` — the bot can no longer
# commit/push to the PR head (its prior `contents: write` + auto-`git push` was a
# live RCE/prompt-injection surface on a public repo). It posts review findings as
# a comment; humans apply fixes. `pull-requests: write` is only for that comment.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # Never run on the bot's own activity (loop guard).
    if: |
      github.actor != 'claude[bot]' &&
      github.event.pull_request.user.login != 'claude[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        # Pinned to v4.3.1 for supply chain security.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Claude review (suggest-only)
        # Pinned to v1.0.26 for supply chain security.
        uses: anthropics/claude-code-action@0d1933529914177075d5bc3558ae3d047f188146
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 5
          prompt: |
            Perform a SUGGEST-ONLY code review of this PR. You have read-only
            access and MUST NOT commit, push, or modify any files — your sole
            output is a single review comment.

            ## Review

            Analyze the PR changes for:
            - TypeScript type errors and type-safety issues
            - ESLint violations and code-style inconsistencies (the repo routes
              logging through `src/utils/log.ts`; raw `console.*` in `src/` is a
              lint error)
            - Security vulnerabilities (XSS, injection, auth bypass, secret leaks)
            - Test gaps and likely-incorrect behavior
            - Real-time-safety regressions (no alloc/lock/block on the audio thread)

            You MAY run read-only checks to validate findings (this repo is
            bun-only; npm/yarn are blocked by a preinstall guard):

            ```bash
            bun run lint        # ESLint
            bun run test:run    # vitest
            bun run build       # tsc + production build
            ```

            ## Output

            Post ONE summary comment on the PR with:
            - The concrete issues found, grouped by category, each with file:line
              and a SUGGESTED fix (as a diff or code block — do not apply it).
            - "No blocking issues found" if the PR is clean.

            Do NOT use `git commit` / `git push` / `git add`, and never write to the
            repository — fixes are the human author's to apply.
