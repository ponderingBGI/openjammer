name: Claude Mention Bot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# FENCED (plan §0.6): SUGGEST/REPLY-ONLY. `contents: read` — a comment can no
# longer drive a write token (its prior `contents: write` + auto-`git push` was an
# RCE/prompt-injection surface: any `@claude` from anyone ran an agent with write
# access). `pull-requests`/`issues: write` are only for posting the reply.
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  respond:
    # Only on a PR comment that @-mentions claude AND comes from a TRUSTED author
    # (OWNER/MEMBER/COLLABORATOR) — never an arbitrary fork user.
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@claude') &&
      github.actor != 'claude[bot]' &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo's OWN (trusted) default branch for context only. The PR's
      # (possibly fork-authored) head is read via the GitHub API, never checked out
      # and executed in this secret-holding job.
      - name: Checkout
        # Pinned to v4.3.1 for supply chain security.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Process @claude mention (suggest/reply-only)
        # Pinned to v1.0.26 for supply chain security.
        uses: anthropics/claude-code-action@0d1933529914177075d5bc3558ae3d047f188146
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --max-turns 3
          prompt: |
            You've been mentioned in a PR comment by @${{ github.event.comment.user.login }}.
            You have READ-ONLY access — you MUST NOT commit, push, or modify any
            files. Your only output is a reply comment.

            ## Context
            **PR**: #${{ github.event.issue.number }}
            **Comment**: ${{ github.event.comment.body }}
            **Comment URL**: ${{ github.event.comment.html_url }}

            ## Task

            Understand the request, read the relevant code + the PR diff (via the
            GitHub API), and reply helpfully:
            - For an explanation/review/question: answer clearly, with file:line
              references.
            - For a requested code change: describe the SUGGESTED change as a diff
              or code block for the human to apply — do NOT apply it yourself.

            This repo is bun-only (npm/yarn are blocked by a preinstall guard); if
            you cite commands, use `bun run lint` / `bun run test:run` / `bun run
            build`. Do NOT run untrusted PR build/test scripts in this job.

            Always finish by posting ONE reply comment summarizing what you
            understood and what you suggest. Never use `git add`/`git commit`/`git
            push`.
