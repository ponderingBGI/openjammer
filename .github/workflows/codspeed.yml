name: CodSpeed

# Continuous performance measurement for the OpenJammer audio hot paths: the
# engine compile + process_block benches (ojcore) and the DSP kernels (ojcore-dsp).
# Runs the criterion benchmarks under CodSpeed's CPU simulation instrument so a
# regression in the real-time audio hot paths is caught on every PR. CodSpeed
# authenticates over OIDC (id-token below) — no token secret required.

on:
  push:
    branches: [main, canari]
  pull_request:
    branches: [main, canari]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC authentication with CodSpeed

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Rust toolchain, cache and cargo-codspeed
        uses: moonrepo/setup-rust@cafffba5d5c8bc38a5120e6e60f3561d541a47cd # v0
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      - name: Build the benchmark target(s)
        run: cargo codspeed build -p ojcore -p ojcore-dsp

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@63f3e98b61959fe67f146a3ff022e4136fe9bb9c # v4
        with:
          mode: simulation
          run: cargo codspeed run
