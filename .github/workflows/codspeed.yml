name: CodSpeed

# Continuous performance measurement for the OpenJammer hot paths, across all
# six benched crates:
#   * ojcore       — engine compile (Kahn topo-sort + routing plan) + process_block
#   * ojcore-native — full First Light scheduled render + WAV24 bounce/encode
#   * ojcore-dsp   — the DSP kernels + the master output guards (soft-limit/scrub)
#   * ojinstrument — polyphonic voice render + a realistic end-to-end patch
#   * ojproto      — the control-plane wire codec (OjGraph / ParamPatch / RtCommand)
#   * ojhost       — control plane + hermetic CLAP host ring (flush/events/state/lifecycle)
#
# Three CodSpeed instruments run on every PR:
#   * simulation — CPU instruction + cache-model count; catches an O(n^2) schedule
#     or a hotter inner loop. The regression GATE — but it is only <1% stable when
#     BASE and HEAD run in the SAME environment. The simulation cost folds in the
#     system `libm` (the synth kernels call sinf/expf/…) and the host cache model,
#     so a runner-image or CPU change between the base and head runs shows up as a
#     uniform double-digit "regression" across UNRELATED benches (e.g. a no-asset
#     Sampler bench, ~30 ns wall-time, swinging 24%). Pin the image below so the
#     base/head environment stays constant; for true hardware reproducibility move
#     to a CodSpeed MACRO runner.
#   * memory     — heap allocations; turns the zero-alloc covenant into a tracked
#     per-PR number, complementing the binary `assert_no_alloc` test gate.
#   * walltime   — absolute wall-clock CPU time for the end-to-end latency bench
#     (`ojinstrument/benches/latency.rs`), so the per-block render cost is tracked
#     in real µs against the block deadline. Wall-clock is hardware-sensitive: it
#     is reliable on a CodSpeed MACRO runner (`runs-on: codspeed-macro`); on the
#     free `ubuntu-latest` runner treat the absolute number as indicative and let
#     `simulation` remain the gate.
# This is a work-done / allocation / CPU-time proxy, NOT a device round-trip gate
# — real <5ms latency is the founder-hardware loopback harness's job. CodSpeed
# authenticates over OIDC (id-token below) — no token secret required.

on:
  push:
    branches: [main, canari]
  pull_request:
    branches: [main, canari]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC authentication with CodSpeed

concurrency:
  # Per-PR-head-SHA so a mid-build push can't drop this run (see ci.yml).
  group: codspeed-${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run benchmarks
    # Pinned (not ubuntu-latest): the simulation gate compares HEAD against the
    # base branch's run, and a shared-runner image/libm/CPU change between them
    # manifests as a phantom regression. A fixed image keeps the environment
    # constant across runs so the comparison reflects code, not infrastructure.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain, cache and cargo-codspeed
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      - name: Build the benchmark target(s) for both instruments
        run: cargo codspeed build -m simulation -m memory -p ojcore -p ojcore-native -p ojcore-dsp -p ojproto -p ojinstrument -p ojhost --features ojhost/clap-host

      - name: Run the benchmarks (CPU simulation)
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: simulation
          run: cargo codspeed run -m simulation

      - name: Run the benchmarks (memory / allocations)
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: memory
          run: cargo codspeed run -m memory

  # Ring 2: deterministic TypeScript control-plane hot paths. The CodSpeed Vitest
  # plugin instruments these in CI and falls back to plain Vitest timing locally.
  web-benchmarks:
    name: Run control-plane benchmarks (Ring 2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install web dependencies
        # Benchmarks do not need the repository's git-hook postinstall. Skipping
        # lifecycle scripts also avoids the package preinstall's npm_execpath guard.
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run the control-plane benchmarks (CPU simulation)
        uses: CodSpeedHQ/action@63f3e98b61959fe67f146a3ff022e4136fe9bb9c # v4
        with:
          mode: simulation
          run: bun run bench:web

  # Wall-clock CPU time for the end-to-end latency bench — an absolute-µs reading
  # of the per-block render cost against the real-time deadline. Separate job so
  # its noisier instrument never gates the deterministic simulation/memory run.
  # NOTE: for stable absolute numbers, switch `runs-on` to a CodSpeed macro runner
  # (`codspeed-macro`); on the shared runner the trend matters more than the value.
  walltime:
    name: Run latency benchmark (walltime)
    # Pinned image (see the benchmarks job); for stable absolute µs, upgrade to a
    # CodSpeed macro runner — on the shared runner the trend matters, not the value.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust toolchain, cache and cargo-codspeed
        uses: moonrepo/setup-rust@abb2d32350334249b178c401e5ec5836e0cd88d3 # v1.3.0
        with:
          channel: stable
          cache-target: release
          bins: cargo-codspeed

      - name: Build the latency benchmark for the walltime instrument
        run: cargo codspeed build -m walltime -p ojinstrument

      - name: Run the benchmarks (walltime)
        uses: CodSpeedHQ/action@4296e51e7041e24dadb86d1d6e8b9320d223dbe8 # v5.0.3
        with:
          mode: walltime
          run: cargo codspeed run -m walltime

  # Ring 3: browser experience trends. CDP frame markers and cold-open timing are
  # preserved as JSON + raw traces; CodSpeed measures the complete J8 executable
  # because its walltime action cannot import arbitrary trace-derived durations.
  # This host's absolute values remain indicative: only repeated macro-runner
  # trends are comparable. The job is intentionally never a merge gate.
  codspeed-walltime:
    name: Long Set experience trend (Ring 3)
    runs-on: codspeed-macro
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install web dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Install Chromium and host libraries
        run: bunx playwright install --with-deps chromium

      - name: Run J8 as a CodSpeed walltime target
        uses: CodSpeedHQ/action@63f3e98b61959fe67f146a3ff022e4136fe9bb9c # v4
        with:
          mode: walltime
          config: codspeed.perf.yml

      - name: Upload Ring 3 CDP traces and metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ring-3-j8-traces-and-stats
          path: perf-results/
          if-no-files-found: warn
          retention-days: 14
