name: Docs

# Build (always) + deploy (main only) the Starlight docs site at apps/docs to
# GitHub Pages. The docs app is workspace-ISOLATED (its own bun.lock), so it
# installs/builds independently of the main app.
#
# NOTE (owner-gated): deployment requires GitHub Pages to be enabled with
# Settings -> Pages -> Source: "GitHub Actions". Until then the build job still
# runs (so docs breakage is caught on every PR that touches them), and the deploy
# job is the only piece that needs Pages turned on.
on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    # Build-verify docs on PRs into either branch (catch breakage before the
    # canari -> main promotion); deploy stays main-only via the deploy job's
    # `if: github.event_name != 'pull_request'`.
    branches: [main, canari]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

# Least privilege at the workflow level; the deploy job widens its own scope.
permissions:
  contents: read

concurrency:
  # Per-PR-head-SHA so a mid-build push can't drop this run (see ci.yml).
  group: docs-pages-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.0
      - name: Install (isolated lockfile)
        run: bun install --frozen-lockfile
      - name: Build
        run: bun run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    # Build-verify on PRs; only deploy from main / manual dispatch.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0
