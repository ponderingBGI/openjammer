name: Release

# Cross-platform native installers for the OpenJammer desktop shell (U22).
#
# Fires on a `v*` tag push and, across a macOS / Linux / Windows matrix, runs
# `tauri-apps/tauri-action` to build each platform's installers
# (.dmg + .app, .deb + .AppImage, NSIS .exe) and attach them to a DRAFT
# GitHub Release. The frontend is the existing Vite web app (built by Tauri's
# `beforeBuildCommand`, "bun run build"); the backend is the native ojcore
# engine compiled into the `openjammer` binary.

on:
  push:
    tags:
      - "v*"

# Needed for tauri-action to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build installers (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon (.app/.dmg). macos-latest is arm64.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            piTarget: "aarch64-apple-darwin"
          # Intel macOS (.app/.dmg).
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            piTarget: "x86_64-apple-darwin"
          # Linux (.deb/.AppImage).
          - platform: ubuntu-latest
            args: ""
            piTarget: "x86_64-unknown-linux-gnu"
          # Windows (NSIS .exe).
          - platform: windows-latest
            args: ""
            piTarget: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux webview build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Cross targets so the macOS matrix can build both arches.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        # src-tauri is a workspace member, so its build artifacts land in the
        # workspace-root target/, not src-tauri/target.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # Turn on signed updater artifacts (latest.json) for this stable build. The
      # committed tauri.conf.json already carries the stable pubkey + the
      # `releases/latest` endpoint and leaves createUpdaterArtifacts OFF (so
      # key-less builds keep working); this flips it on. The stable signing key is
      # the secret below; the public key is owner-pasted into tauri.conf.json
      # (OWNER-PROVISIONING.md §3).
      - name: Stable build config (updater artifacts)
        shell: bash
        run: |
          set -euo pipefail
          conf=src-tauri/tauri.conf.json
          tmp=$(mktemp)
          jq '.bundle.createUpdaterArtifacts = true' "$conf" > "$tmp" && mv "$tmp" "$conf"

      - name: Build + release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The STABLE minisign key signs the update payload (tag-scoped: this
          # workflow only ever runs on a `v*` tag, never on a PR/push job).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPENJAMMER_PI_TARGET: ${{ matrix.piTarget }}
        with:
          # Tag/release wiring. `__VERSION__` is substituted from the app config.
          tagName: ${{ github.ref_name }}
          releaseName: "OpenJammer ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install OpenJammer for your platform."
          # Auto-publish on tag (founder decision): every `v*` tag is immediately
          # live at /releases/latest, so the download page + updater resolve at once.
          releaseDraft: false
          prerelease: false
          # The Tauri project lives in `src-tauri`; the frontend is the repo root
          # Vite app, built by the config's `beforeBuildCommand` ("bun run build").
          projectPath: "."
          args: ${{ matrix.args }}

  # Bake the just-published release's per-asset URLs into
  # public/download/releases.json so the static /download page renders the
  # newest version instantly (and survives a GitHub API outage). The page still
  # refreshes live from the REST API at runtime, so this is purely the fast,
  # offline-safe default. Best-effort: never fails the release.
  bake-manifest:
    name: Bake download manifest
    needs: release
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate public/download/releases.json from the latest release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          rel="$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" "$api" || true)"
          if [ -z "$rel" ]; then
            echo "Latest release not resolvable yet — leaving baked releases.json untouched."
            exit 0
          fi
          # Re-pick assets by the SAME suffix regexes the page uses. These must be
          # confirmed against the first published release's real assets[].name.
          out="$(printf '%s' "$rel" | jq '{
            version: .tag_name,
            platforms: {
              "darwin-aarch64":       { browser_download_url: ((.assets[] | select(.name | test("_aarch64\\.dmg$"))      | .browser_download_url) // "https://github.com/ponderingBGI/openjammer/releases/latest") },
              "darwin-x86_64":        { browser_download_url: ((.assets[] | select(.name | test("_x64\\.dmg$"))          | .browser_download_url) // "https://github.com/ponderingBGI/openjammer/releases/latest") },
              "windows-x86_64":       { browser_download_url: ((.assets[] | select(.name | test("_x64-setup\\.exe$"))    | .browser_download_url) // "https://github.com/ponderingBGI/openjammer/releases/latest") },
              "linux-x86_64-appimage":{ browser_download_url: ((.assets[] | select(.name | test("_amd64\\.AppImage$"))   | .browser_download_url) // "https://github.com/ponderingBGI/openjammer/releases/latest") },
              "linux-x86_64-deb":     { browser_download_url: ((.assets[] | select(.name | test("_amd64\\.deb$"))        | .browser_download_url) // "https://github.com/ponderingBGI/openjammer/releases/latest") }
            }
          }' || true)"
          if [ -z "$out" ]; then
            echo "jq transform failed — leaving baked releases.json untouched."
            exit 0
          fi
          printf '%s\n' "$out" > public/download/releases.json
          echo "Baked public/download/releases.json:"
          cat public/download/releases.json

      - name: Commit the refreshed manifest
        continue-on-error: true
        run: |
          set -uo pipefail
          if git diff --quiet -- public/download/releases.json; then
            echo "No change to releases.json — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "${GITHUB_REF_NAME}-baked-manifest" || true
          git add public/download/releases.json
          git commit -m "chore(download): bake releases.json for ${GITHUB_REF_NAME}" || true
          # Push to the repo's default branch so the next Vercel deploy ships the
          # fresh URLs. Best-effort: a protected branch just no-ops here.
          default_branch="$(git remote show origin | sed -n 's/.*HEAD branch: //p')"
          git push origin "HEAD:${default_branch}" || \
            echo "Push skipped (protected branch or no permission) — runtime REST refresh still serves newest."
