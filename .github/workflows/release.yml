name: Release

# Stable releases are minted when the canari -> main promotion lands. The first
# real stable release is v0.0.1; every automatic promotion increments patch only.
# A manual dispatch may provide target_version (for example 0.1.0) to move to a
# new minor line, after which automatic patch releases continue from there.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_version:
        description: "Exact stable SemVer core to publish, e.g. 0.1.0"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare stable release
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      version: ${{ steps.mode.outputs.version || steps.plan.outputs.version }}
      tag: ${{ steps.mode.outputs.tag || steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2

      - name: Resolve release mode
        id: mode
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$COMMIT_MESSAGE" =~ ^chore\(release\):\ publish\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            {
              echo "mode=publish"
              echo "version=$version"
              echo "tag=v$version"
            } >> "$GITHUB_OUTPUT"
          else
            echo "mode=prepare-pr" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve requested stable version
        if: ${{ steps.mode.outputs.mode == 'prepare-pr' }}
        id: request
        env:
          GH_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          DISPATCH_TARGET: ${{ inputs.target_version }}
        shell: bash
        run: |
          set -euo pipefail
          target="${DISPATCH_TARGET:-}"
          if [ -z "$target" ] && [ "${{ github.event_name }}" = "push" ]; then
            pr_json="$(gh api "repos/$REPO/commits/$SHA/pulls" \
              -H "Accept: application/vnd.github+json" 2>/dev/null || true)"
            target="$(jq -r '.[0].body // ""' <<<"$pr_json" \
              | sed -n 's/^oj-next-stable:[[:space:]]*//p' | head -1 || true)"
          fi
          echo "target_version=$target" >> "$GITHUB_OUTPUT"

      - name: Compute next stable version
        if: ${{ steps.mode.outputs.mode == 'prepare-pr' }}
        id: plan
        env:
          GH_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/oj/release.ts next-stable \
            --repo "${{ github.repository }}" \
            --target-version "${{ steps.request.outputs.target_version }}"

      - name: Stamp source version
        if: ${{ steps.mode.outputs.mode == 'prepare-pr' }}
        run: bun scripts/oj/release.ts stamp "${{ steps.plan.outputs.version }}"

      - name: Open protected release version PR
        if: ${{ steps.mode.outputs.mode == 'prepare-pr' }}
        env:
          GH_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          branch="release/publish-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml package.json packages/oj-protocol-ts/package.json src-tauri/tauri.conf.json
          if git diff --cached --quiet; then
            echo "Version files are already stamped for ${TAG}."
            exit 0
          fi
          git switch -c "$branch"
          git commit -m "chore(release): publish ${TAG}"
          git push --force \
            "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git" \
            "HEAD:$branch"
          existing="$(gh pr list --base main --head "$branch" --state open \
            --json number --jq '.[0].number // empty')"
          body="Stamps OpenJammer source versions for ${TAG}. Merging this PR publishes the stable release."
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "chore(release): publish ${TAG}" --body "$body"
            pr="$existing"
          else
            pr_url="$(gh pr create --base main --head "$branch" \
              --title "chore(release): publish ${TAG}" \
              --body "$body")"
            pr="${pr_url##*/}"
          fi
          gh pr merge "$pr" --squash --auto --subject "chore(release): publish ${TAG}" || true

      - name: Validate stamped source version
        if: ${{ steps.mode.outputs.mode == 'publish' }}
        run: bun scripts/oj/index.ts doctor --check version-sync

      - name: Create stable tag
        if: ${{ steps.mode.outputs.mode == 'publish' }}
        env:
          RELEASE_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.mode.outputs.tag }}" -m "OpenJammer ${{ steps.mode.outputs.tag }}"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git" "${{ steps.mode.outputs.tag }}"

  release:
    name: Build installers (${{ matrix.platform }})
    needs: prepare
    if: ${{ needs.prepare.outputs.mode == 'publish' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            piTarget: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            piTarget: "x86_64-apple-darwin"
          - platform: ubuntu-latest
            args: ""
            piTarget: "x86_64-unknown-linux-gnu"
          - platform: windows-latest
            args: ""
            piTarget: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Linux webview build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config

      - uses: oven-sh/setup-bun@v2

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Stable build config (updater artifacts)
        shell: bash
        run: |
          set -euo pipefail
          conf=src-tauri/tauri.conf.json
          tmp=$(mktemp)
          jq '.bundle.createUpdaterArtifacts = true' "$conf" > "$tmp" && mv "$tmp" "$conf"

      - name: Build + release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          OPENJAMMER_PI_TARGET: ${{ matrix.piTarget }}
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "OpenJammer ${{ needs.prepare.outputs.tag }}"
          releaseBody: "Stable OpenJammer release ${{ needs.prepare.outputs.tag }}."
          releaseDraft: false
          prerelease: false
          projectPath: "."
          args: ${{ matrix.args }}

  bake-manifest:
    name: Bake download manifest
    needs: [prepare, release]
    if: ${{ needs.prepare.outputs.mode == 'publish' && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Regenerate public/download/releases.json from the latest release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest"
          rel="$(curl -fsSL -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" "$api" || true)"
          if [ -z "$rel" ]; then
            echo "Latest release not resolvable yet — leaving baked releases.json untouched."
            exit 0
          fi
          out="$(printf '%s' "$rel" | jq '{
            version: .tag_name,
            platforms: {
              "darwin-aarch64":       { browser_download_url: ((.assets[] | select(.name | test("_aarch64\\.dmg$"))      | .browser_download_url) // "https://github.com/ponderingBGI/openjammer/releases/latest") },
              "darwin-x86_64":        { browser_download_url: ((.assets[] | select(.name | test("_x64\\.dmg$"))          | .browser_download_url) // "https://github.com/ponderingBGI/openjammer/releases/latest") },
              "windows-x86_64":       { browser_download_url: ((.assets[] | select(.name | test("_x64-setup\\.exe$"))    | .browser_download_url) // "https://github.com/ponderingBGI/openjammer/releases/latest") },
              "linux-x86_64-appimage":{ browser_download_url: ((.assets[] | select(.name | test("_amd64\\.AppImage$"))   | .browser_download_url) // "https://github.com/ponderingBGI/openjammer/releases/latest") },
              "linux-x86_64-deb":     { browser_download_url: ((.assets[] | select(.name | test("_amd64\\.deb$"))        | .browser_download_url) // "https://github.com/ponderingBGI/openjammer/releases/latest") }
            }
          }' || true)"
          [ -n "$out" ] || exit 0
          printf '%s\n' "$out" > public/download/releases.json

      - name: Open canari sync PR with refreshed manifest
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -uo pipefail
          if git diff --quiet -- public/download/releases.json; then
            echo "No manifest change."
            exit 0
          fi
          branch="release-sync/${TAG}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/download/releases.json
          git commit -m "chore(download): bake releases.json for ${TAG}" || exit 0
          git push origin "HEAD:$branch"
          gh pr create \
            --base canari \
            --head "$branch" \
            --title "Sync download manifest for ${TAG}" \
            --body "Bakes the latest stable download URLs after ${TAG}."
