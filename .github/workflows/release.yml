name: Release

# Cross-platform native installers for the OpenJammer desktop shell (U22).
#
# Fires on a `v*` tag push and, across a macOS / Linux / Windows matrix, runs
# `tauri-apps/tauri-action` to build each platform's installers
# (.dmg + .app, .deb + .AppImage, .msi + .exe) and attach them to a DRAFT
# GitHub Release. The frontend is the existing Vite web app (built by Tauri's
# `beforeBuildCommand`, "bun run build"); the backend is the native ojcore
# engine compiled into the `openjammer` binary.

on:
  push:
    tags:
      - "v*"

# Default-deny at the workflow level (zizmor excessive-permissions): the read-only
# version-gate needs nothing, and only the `release` job elevates to contents:write
# (for tauri-action to create the GitHub Release and upload assets).
permissions:
  contents: read

jobs:
  # Three-way version equality (plan §0.2 must-fix): the pushed v* tag, the Cargo
  # workspace version the binary compiles with, and tauri.conf.json's version must
  # all agree — read at THIS tag's checkout, so they describe the bytes about to
  # ship. A mismatch (e.g. a stale 0.0.0 seed) red-walls the release BEFORE the
  # expensive matrix build, so a 0.0.0 binary can never ship into an infinite
  # update-prompt loop against the R2 updater (which compares tauri.conf.json).
  version-gate:
    name: Version equality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
      - name: tag == Cargo workspace version == tauri.conf.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          # Section-scoped read of [workspace.package].version — never the first
          # `version =` in the file (which could be a [workspace.dependencies] dep).
          CARGO=$(awk '/^\[workspace\.package\]/{w=1;next} /^\[/{w=0} w&&$1=="version"{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)
          test -n "$CARGO" || { echo "::error::workspace.package.version not found in Cargo.toml"; exit 1; }
          CONF=$(jq -r .version src-tauri/tauri.conf.json)
          echo "tag=$TAG cargo=$CARGO conf=$CONF"
          test "$TAG" = "$CARGO" || { echo "::error::tag $TAG != Cargo workspace version $CARGO"; exit 1; }
          test "$TAG" = "$CONF"  || { echo "::error::tag $TAG != tauri.conf.json version $CONF"; exit 1; }
          echo "All three versions agree: $TAG"

  release:
    name: Build installers (${{ matrix.platform }})
    needs: version-gate
    # Scoped here (not workflow-level): tauri-action creates the Release + uploads.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon (.app/.dmg). macos-latest is arm64.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          # Intel macOS (.app/.dmg).
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          # Linux (.deb/.AppImage).
          - platform: ubuntu-latest
            args: ""
          # Windows (.msi/.exe).
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Linux webview build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2 # zizmor: ignore[cache-poisoning] release runs only on a v* tag push; no lower-privileged (PR) event shares this cache scope

      - name: Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable   # required: the ref is SHA-pinned
          # Cross targets so the macOS matrix can build both arches.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        # src-tauri is a workspace member, so its build artifacts land in the
        # workspace-root target/, not src-tauri/target.
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2 # zizmor: ignore[cache-poisoning] release runs only on a v* tag push; no lower-privileged (PR) event shares this cache scope
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build + release (tauri-action)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tag/release wiring. `__VERSION__` is substituted from the app config.
          tagName: ${{ github.ref_name }}
          releaseName: "OpenJammer ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install OpenJammer for your platform."
          releaseDraft: true
          prerelease: false
          # The Tauri project lives in `src-tauri`; the frontend is the repo root
          # Vite app, built by the config's `beforeBuildCommand` ("bun run build").
          projectPath: "."
          args: ${{ matrix.args }}
