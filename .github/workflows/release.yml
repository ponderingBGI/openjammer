name: Release

# Cross-platform native installers for the OpenJammer desktop shell (U22).
#
# Fires on a `v*` tag push and, across a macOS / Linux / Windows matrix, runs
# `tauri-apps/tauri-action` to build each platform's installers
# (.dmg + .app, .deb + .AppImage, .msi + .exe) and attach them to a DRAFT
# GitHub Release. The frontend is the existing Vite web app (built by Tauri's
# `beforeBuildCommand`, "bun run build"); the backend is the native ojcore
# engine compiled into the `openjammer` binary.

on:
  push:
    tags:
      - "v*"

# Needed for tauri-action to create the GitHub Release and upload assets.
permissions:
  contents: write

jobs:
  release:
    name: Build installers (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon (.app/.dmg). macos-latest is arm64.
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
            piTarget: "aarch64-apple-darwin"
          # Intel macOS (.app/.dmg).
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
            piTarget: "x86_64-apple-darwin"
          # Linux (.deb/.AppImage).
          - platform: ubuntu-latest
            args: ""
            piTarget: "x86_64-unknown-linux-gnu"
          # Windows (.msi/.exe).
          - platform: windows-latest
            args: ""
            piTarget: "x86_64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux webview build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Cross targets so the macOS matrix can build both arches.
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        # src-tauri is a workspace member, so its build artifacts land in the
        # workspace-root target/, not src-tauri/target.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build + release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENJAMMER_PI_TARGET: ${{ matrix.piTarget }}
        with:
          # Tag/release wiring. `__VERSION__` is substituted from the app config.
          tagName: ${{ github.ref_name }}
          releaseName: "OpenJammer ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install OpenJammer for your platform."
          releaseDraft: true
          prerelease: false
          # The Tauri project lives in `src-tauri`; the frontend is the repo root
          # Vite app, built by the config's `beforeBuildCommand` ("bun run build").
          projectPath: "."
          args: ${{ matrix.args }}
