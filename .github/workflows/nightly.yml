name: Lane B (nightly)

# Heavy correctness backstop (plan §2.5 / §4.3). Lane B is the slow, thorough
# leg that does NOT gate per-PR merges — it runs on a schedule + on demand, so a
# long run (or a genuine finding) never blocks a merge. It runs miri over the
# shared-memory SPSC ring and the unsafe hot-swap cell, and performs
# UNBOUNDED fuzz of the untrusted WAV parse surface (the bounded per-PR smoke is
# `crates/ojcore-native/tests/fuzz_smoke.rs`). loom model checking is the next
# addition here.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lane-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    name: miri — shared-memory ring + unsafe hot-swap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust nightly + miri
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: miri
      - name: miri — wait-free SPSC ByteRing + swap
        # Miri checks the ring's shared-memory access model and the RtProgram
        # hot-swap's load-bearing `unsafe`. Isolation is disabled so tests that
        # read the clock/time work under miri.
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +nightly miri test -p ojcore-midiring
          cargo +nightly miri test -p ojcore swap

  loom:
    name: loom — SPSC ring interleavings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: loom model-check the wait-free SPSC ring
        # Exhaustively explores the producer/consumer atomic interleavings (data
        # region modeled as a loom cell) — the weak-memory class the single-threaded
        # deterministic-sim harness structurally can't reach. Production is
        # `cfg(not(loom))` and untouched; only this `--cfg loom` build pulls loom in.
        run: RUSTFLAGS="--cfg loom" cargo test -p ojcore-midiring --test loom_ring

  fuzz:
    name: fuzz — WAV parse surface (unbounded)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ALSA dev headers (cpal/alsa-sys)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Rust nightly
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
      - name: Install cargo-fuzz (prebuilt binary)
        # taiki-e/install-action fetches a prebuilt binary in seconds instead of
        # compiling cargo-fuzz from source (matches the per-PR nextest install).
        uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2
        with:
          tool: cargo-fuzz
      - name: Fuzz the WAV decoder (time-boxed)
        # A clean Err on any input is correct; a crash/UB is a finding. Time-boxed
        # so the nightly stays bounded; the corpus is seeded from the smoke's RIFF
        # shapes implicitly via libFuzzer's mutation.
        # cargo-fuzz defaults to the target it was built for. Its prebuilt Linux
        # binary is musl-linked, while libFuzzer's address sanitizer requires the
        # GNU runner target with dynamically linked libc.
        run: |
          cargo +nightly fuzz run wav_decode --target x86_64-unknown-linux-gnu -- \
            -max_total_time=300 -rss_limit_mb=4096

  durability:
    name: durability — real-process SIGKILL crash test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ALSA dev headers (cpal/alsa-sys)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Crash-kill the atomic-write path and verify recovery
        # The real-process cross-check for the SimFs protocol model: a child writes
        # versions through `atomic_write` and is SIGKILLed mid-flight; recovery must
        # always find a COMPLETE value, never a torn file (Track B durability).
        run: cargo test -p ojcore-native --test durability_crash -- --ignored

  realworld-plugins:
    name: P4 — pinned OSS CLAP matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      OJ_PLUGIN_CACHE: ${{ github.workspace }}/.cache/oj-plugins
      OJ_REALWORLD_PLUGINS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Restore verified plugin artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/oj-plugins
          key: p4-plugins-linux-${{ hashFiles('crates/ojhost/tests/fixtures/realworld-plugins.toml') }}
      - name: Download, SHA-256 verify and extract the OSS matrix
        run: scripts/ci/fetch-plugins.sh
      - name: Full real-world scan → lifecycle → render → state matrix
        run: cargo test -p ojhost --features clap-host --test realworld -- --nocapture
      - name: N4 against the cached real synth (Dexed)
        run: |
          plugin=$(find "$OJ_PLUGIN_CACHE/plugins/dexed" -name Dexed.clap -print -quit)
          OJ_N4_PLUGIN="$plugin" cargo test -p ojhost --features clap-host --test native_journeys n4_timeline_synth_automation_state_reload_and_export -- --nocapture

  juce-vst3-parity:
    name: P4 — JUCE VST3 lifecycle smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OJHOST_JUCE_JOBS: '4'
      OJ_PLUGIN_CACHE: ${{ github.workspace }}/.cache/oj-plugins
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
      - name: Restore the verified Dexed artifact
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/oj-plugins
          key: p4-plugins-linux-${{ hashFiles('crates/ojhost/tests/fixtures/realworld-plugins.toml') }}
      - name: Fetch Dexed when the cache is cold
        env:
          OJ_PLUGIN_IDS: dexed
        run: scripts/ci/fetch-plugins.sh
      # Rust cache includes Cargo's pinned JUCE 8.0.4/CMake build tree.
      - name: JUCE scan + instantiate + activate + process + destroy VST3 smoke
        # Honest gap: clap-juce-extensions creates CLAP plugins but explicitly
        # does not implement JUCE CLAP hosting. A JUCE-wrapped VST3 probe is not
        # vendored here, so the fallback required by P4 uses Dexed's OSS VST3.
        run: |
          plugin=$(find "$OJ_PLUGIN_CACHE/plugins/dexed" -name Dexed.vst3 -print -quit)
          OJHOST_JUCE_TEST_PLUGIN="$plugin" cargo test -p ojhost --features juce --test conformance juce_vst3_oss_scan_and_lifecycle_smoke -- --nocapture
