name: Lane B (nightly)

# Heavy correctness backstop (plan §2.5 / §4.3). Lane B is the slow, thorough
# leg that does NOT gate per-PR merges — it runs on a schedule + on demand, so a
# long run (or a genuine finding) never blocks a merge. It currently runs miri
# over the workspace's unsafe-heavy code (the wait-free SPSC ring + the hot-swap
# cell); loom-instrumented model checking and unbounded fuzz of the untrusted
# parse surface (SF2 / WAV / graph-JSON) are the next additions here.

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lane-b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    name: miri — unsafe ring + hot-swap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Rust nightly + miri
        uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
        with:
          toolchain: nightly
          components: miri
      - name: miri — wait-free SPSC ByteRing (copy_nonoverlapping) + swap
        # The ring and the RtProgram hot-swap are the workspace's load-bearing
        # `unsafe`. miri runs their existing tests under its UB checker. Isolation
        # is disabled so tests that read the clock/time work under miri.
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +nightly miri test -p ojcore-midiring
          cargo +nightly miri test -p ojcore swap
