name: Browser journeys

on:
  push:
    branches: [canari]
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-journeys-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    name: Journeys (${{ matrix.engine }}, shard ${{ matrix.shard }}/3)
    # GitHub's hosted Ubuntu network can leave headless Firefox with zero ICE
    # candidates. Keep J7 as a real WebRTC test by running Firefox on a hosted
    # macOS VM instead of skipping or mocking the collaboration transport.
    runs-on: ${{ matrix.engine == 'firefox' && 'macos-15-intel' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup web (Bun + install)
        uses: ./.github/actions/setup-web
      - name: Install WebKit host libraries
        if: matrix.engine == 'webkit'
        run: bunx playwright install-deps webkit
      - name: Install browser engine
        run: bunx playwright install ${{ matrix.engine }}
      - name: Run journey shard
        # Measured locally on 2026-08-17 before sharding (production build
        # included): Chromium 36.0s and Firefox 36.5s. WebKit is CI-measured
        # because this workstation lacks libwoff2dec.so.1.0.2.
        env:
          OJ_E2E_ALL_BROWSERS: '1'
        run: bun run test:e2e -- e2e/journeys --project=${{ matrix.engine }} --shard=${{ matrix.shard }}/3
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journey-traces-${{ matrix.engine }}-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
