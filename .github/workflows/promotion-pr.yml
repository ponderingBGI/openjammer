name: Promotion PR

# Keeps one open release-candidate PR from canari -> main. The title is the
# stable version that will be published after merge, e.g. "Release v0.0.1".

on:
  push:
    branches: [canari]
  workflow_dispatch:
    inputs:
      target_version:
        description: "Optional exact stable SemVer core for the next promotion, e.g. 0.1.0"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: promotion-pr
  cancel-in-progress: true

jobs:
  promotion-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2

      - name: Maintain the canari -> main release-candidate PR
        env:
          GH_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_VERSION: ${{ inputs.target_version }}
        shell: bash
        run: |
          set -euo pipefail

          ahead=$(gh api "repos/$REPO/compare/main...canari" --jq '.ahead_by' 2>/dev/null || echo 0)
          if [ "${ahead:-0}" -eq 0 ]; then
            echo "canari is not ahead of main — no release candidate to maintain."
            exit 0
          fi

          target="${TARGET_VERSION:-}"
          if [ -z "$target" ]; then
            existing_body="$(gh pr list --repo "$REPO" --base main --head canari --state open \
              --json body --jq '.[0].body // ""')"
            target="$(printf '%s\n' "$existing_body" \
              | sed -n 's/^oj-next-stable:[[:space:]]*//p' | head -1 || true)"
          fi

          version="$(bun scripts/oj/release.ts next-stable \
            --repo "$REPO" \
            --target-version "$target")"
          title="Release v$version (canari -> main)"
          echo "title: $title"

          body=$(mktemp)
          {
            echo "**Standing release candidate.** Everything on \`canari\` that is not in a stable release yet collects here."
            echo
            echo "oj-next-stable: $version"
            echo
            echo "- Merge this PR with a merge commit to promote \`canari -> main\`."
            echo "- The stable release workflow will publish \`v$version\` after this lands."
            echo "- Canari builds before merge are named \`v$version-canari.N\`."
            echo "- To jump release lines, rerun this workflow with \`target_version\` such as \`0.1.0\`."
            echo
            echo "Auto-maintained by \`.github/workflows/promotion-pr.yml\`."
          } > "$body"

          existing=$(gh pr list --repo "$REPO" --base main --head canari --state open \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Updating PR #$existing"
            gh pr edit "$existing" --repo "$REPO" --title "$title" --body-file "$body"
          else
            echo "Opening release-candidate PR"
            gh pr create --repo "$REPO" --base main --head canari --title "$title" --body-file "$body"
          fi
