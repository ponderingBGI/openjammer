name: Native end-to-end

on:
  push:
    branches: [main, canari]
  pull_request:
    branches: [main, canari]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-e2e-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  OJ_DEV_SKIP_PI: '1'

jobs:
  linux:
    name: Linux N1 + N2 + N3 + N4 + N5
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Setup web
        uses: ./.github/actions/setup-web
      - name: Setup Rust and native dependencies
        uses: ./.github/actions/setup-rust
      - name: Restore nightly real-plugin cache when available
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: .cache/oj-plugins
          key: p4-plugins-linux-${{ hashFiles('crates/ojhost/tests/fixtures/realworld-plugins.toml') }}
      - name: Prefer Dexed for N4 when the nightly cache was restored
        shell: bash
        run: |
          plugin=$(find .cache/oj-plugins/plugins/dexed -name Dexed.clap -print -quit 2>/dev/null || true)
          if [ -n "$plugin" ]; then
            echo "OJ_N4_PLUGIN=$PWD/$plugin" >> "$GITHUB_ENV"
          fi
      - name: Install native WebDriver and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y webkit2gtk-driver xvfb
          cargo install tauri-driver --locked
      - name: Provide an ALSA null output for native engine frames
        run: printf 'pcm.!default { type null }\nctl.!default { type null }\n' > "$HOME/.asoundrc"
      - name: Build frontend and scaffold-host desktop app
        run: |
          bun run build
          mkdir -p src-tauri/binaries
          cargo build -p oj-tauri --no-default-features --features custom-protocol,plugin-host-clap
      - name: N1 + N2 real-app journeys
        env:
          OJ_NATIVE_E2E_RUN: '1'
        run: xvfb-run -a bun test e2e-native/native-e2e.test.ts
      - name: N3 deterministic WAV + FLAC bounce
        run: bun test e2e-native/n3-determinism.test.ts
      - name: N4 + N5 hosted-plugin journeys (probe fallback; real synth when provided)
        run: bun test e2e-native/n4-n5-hosting.test.ts

  windows:
    name: Windows N1 + N2 + N3
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Setup web
        uses: ./.github/actions/setup-web
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Install tauri-driver and matching Edge driver
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool --locked
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          $PWD.Path | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      # WebView2 150+ broke WebDriver session creation on GitHub-hosted Windows
      # runners: msedgedriver times out with "DevToolsActivePort file doesn't
      # exist". This is an UPSTREAM runtime regression, not an app bug — Tauri's
      # own webdriver-example CI passed on WebView2 148/149 and fails with this
      # exact error since 150.0.4078.65 (2026-07-18) and still on 151.0.4129.72:
      #   https://github.com/tauri-apps/webdriver-example/actions/runs/29622188753/job/88019271667
      #   https://github.com/tauri-apps/webdriver-example/actions/runs/31864495419/job/94963272787
      # Truthful, version-gated skip (the repo pattern): the WebDriver journeys
      # skip LOUDLY only while the runner's Evergreen runtime is on a broken
      # major; a future image with a fixed runtime re-arms them automatically.
      # N3 (no WebDriver) and the native build/audio gates keep running. The
      # durable alternatives — a pinned Fixed-Version WebView2 + exactly
      # matching driver held as a repo artifact, or Tauri's embedded WebDriver
      # provider — need owner-provisioned artifacts/secrets.
      - name: Detect WebView2 WebDriver automation support
        id: webview2
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).pv
          if (-not $version) { $version = '0.0.0.0' }
          $major = [int]($version.Split('.')[0])
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($major -ge 150) {
            "broken=true" >> $env:GITHUB_OUTPUT
            Write-Host "::warning title=WebView2 $version cannot create WebDriver sessions::Skipping the Windows N1+N2 WebDriver journeys - upstream regression since WebView2 150 (see workflow comments). N3 and the audio/build gates still run."
          } else {
            "broken=false" >> $env:GITHUB_OUTPUT
          }
      - name: Build frontend and scaffold-host desktop app
        shell: bash
        run: |
          bun run build
          mkdir -p src-tauri/binaries
          cargo build -p oj-tauri --features custom-protocol
      - name: N1 + N2 real-app journeys
        if: steps.webview2.outputs.broken != 'true'
        env:
          OJ_NATIVE_E2E_RUN: '1'
        run: bun test e2e-native/native-e2e.test.ts
      - name: N3 deterministic WAV + FLAC bounce
        run: bun test e2e-native/n3-determinism.test.ts

  macos:
    name: macOS N3 + engine goldens
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Setup web
        uses: ./.github/actions/setup-web
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
      - name: Existing engine unit and golden suites
        run: cargo test -p ojcore -p ojinstrument -p ojcore-native
      - name: N3 deterministic WAV + FLAC bounce
        run: bun test e2e-native/n3-determinism.test.ts
