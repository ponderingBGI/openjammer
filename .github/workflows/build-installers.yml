name: Build installers (on demand)

# Manually-triggered cross-platform build that produces downloadable installer
# artifacts WITHOUT needing a version tag — so the maintainer can grab a fresh
# Windows/macOS/Linux build to test on real hardware straight from the Actions
# tab. (Tagged `v*` releases still go through release.yml -> a GitHub Release.)

on:
  workflow_dispatch:

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            piTarget: "aarch64-apple-darwin"
          - platform: ubuntu-latest
            piTarget: "x86_64-unknown-linux-gnu"
          - platform: windows-latest
            piTarget: "x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Linux desktop + JUCE build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxext-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libgl1-mesa-dev

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build the native app + installers
        env:
          OPENJAMMER_PI_TARGET: ${{ matrix.piTarget }}
          # VST2 is owner-provisioned only. Empty/default -> VST2 disabled;
          # provision both values to produce VST2-enabled private/public builds.
          OJHOST_ENABLE_VST2: ${{ secrets.OJHOST_ENABLE_VST2 }}
          VST2_SDK_DIR: ${{ secrets.VST2_SDK_DIR }}
          VST3_SDK_DIR: ${{ secrets.VST3_SDK_DIR }}
        run: bun run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openjammer-${{ matrix.platform }}
          path: |
            target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
