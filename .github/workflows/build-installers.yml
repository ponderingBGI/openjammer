name: Build installers (on demand)

# Manually-triggered cross-platform build that produces downloadable installer
# artifacts WITHOUT needing a version tag — so the maintainer can grab a fresh
# Windows/macOS/Linux build to test on real hardware straight from the Actions
# tab. (Tagged `v*` releases still go through release.yml -> a GitHub Release.)

on:
  workflow_dispatch:

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            piTarget: "aarch64-apple-darwin"
          - platform: ubuntu-latest
            piTarget: "x86_64-unknown-linux-gnu"
          - platform: windows-latest
            piTarget: "x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Linux webview build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config

      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build the native app + installers
        env:
          OPENJAMMER_PI_TARGET: ${{ matrix.piTarget }}
        run: bun run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: openjammer-${{ matrix.platform }}
          path: |
            target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
