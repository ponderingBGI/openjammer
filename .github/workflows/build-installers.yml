name: Build installers (on demand)

# Manually-triggered cross-platform build that produces downloadable installer
# artifacts WITHOUT needing a version tag — so the maintainer can grab a fresh
# Windows/macOS/Linux build to test on real hardware straight from the Actions
# tab. (Tagged `v*` releases still go through release.yml -> a GitHub Release.)

on:
  workflow_dispatch:

concurrency:
  group: build-installers-${{ github.ref }}
  cancel-in-progress: true

# Least privilege (zizmor excessive-permissions): this only builds + uploads
# workflow artifacts; it does not publish a Release (that is release.yml).
permissions:
  contents: read

jobs:
  build:
    name: Build installer (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Linux webview build deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libasound2-dev \
            pkg-config

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          toolchain: stable   # required: the ref is SHA-pinned
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32  # v2
        with:
          workspaces: ". -> target"

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build the native app + installers
        run: bun run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: openjammer-${{ matrix.platform }}
          path: |
            target/release/bundle/**
          if-no-files-found: warn
          retention-days: 14
