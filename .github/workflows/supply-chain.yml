name: Supply chain

# Supply-chain gate (Track A P0a). Two complementary checks, both free for public
# OSS repos:
#   • cargo-deny (per-PR, on Cargo-metadata changes): bans / licenses / sources,
#     read offline from Cargo.lock against the pinned `deny.toml`.
#   • cargo-audit (nightly): live RustSec advisories — kept OFF the PR path so a
#     freshly-disclosed CVE never red-walls an unrelated PR.
#
# cargo-deny (per-PR) is now a REQUIRED, blocking check — the deny.toml allow-list is
# confirmed green (bans · licenses · sources all pass). cargo-audit (nightly) stays
# `continue-on-error` so a freshly disclosed CVE REPORTS but never red-walls an
# unrelated PR. Add "cargo-deny (bans · licenses · sources)" to branch protection.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/supply-chain.yml"
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC daily (after Lane B)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per-PR-head-SHA so a mid-build push can't drop this run (see ci.yml).
  group: supply-chain-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny (bans · licenses · sources)
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-deny (prebuilt binary)
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-deny
      - name: cargo deny check
        run: cargo deny --all-features check bans licenses sources

  cargo-audit:
    name: cargo-audit (RustSec advisories)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true # a fresh CVE reports, never blocks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - name: Install cargo-audit (prebuilt binary)
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
