name: Canari

# Numbered prereleases from the integration branch. If the next stable promotion
# will be v0.0.2, canari builds are v0.0.2-canari.1, v0.0.2-canari.2, ...

on:
  push:
    branches: [canari]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: canari-release
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ vars.CANARY_RELEASES_ENABLED == 'true' }}
    name: Prepare canari version
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.canari.outputs.base }}
      version: ${{ steps.canari.outputs.version }}
      tag: ${{ steps.canari.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Resolve promotion target
        id: stable
        env:
          GH_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(gh pr list --base main --head canari --state open \
            --json body --jq '.[0].body // ""')"
          target="$(printf '%s\n' "$body" \
            | sed -n 's/^oj-next-stable:[[:space:]]*//p' | head -1 || true)"
          if [ -n "$target" ]; then
            echo "version=$target" >> "$GITHUB_OUTPUT"
          else
            bun scripts/oj/release.ts next-stable --repo "${{ github.repository }}" \
              | tee stable.txt
            echo "version=$(cat stable.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next canari version
        id: canari
        env:
          GH_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/oj/release.ts next-canari \
            --repo "${{ github.repository }}" \
            --base "${{ steps.stable.outputs.version }}"

      - name: Reserve canari tag
        env:
          RELEASE_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.canari.outputs.tag }}" \
            -m "OpenJammer Canari ${{ steps.canari.outputs.tag }}"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git" \
            "${{ steps.canari.outputs.tag }}"

  build:
    name: Canari installers (${{ matrix.platform }})
    needs: prepare
    if: ${{ vars.CANARY_RELEASES_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --features plugin-host-juce"
            piTarget: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --features plugin-host-juce"
            piTarget: "x86_64-apple-darwin"
          - platform: ubuntu-latest
            args: "--features plugin-host-juce"
            piTarget: "x86_64-unknown-linux-gnu"
          - platform: windows-latest
            args: "--features plugin-host-juce"
            piTarget: "x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup web (Bun + install)
        uses: ./.github/actions/setup-web
      - name: Linux webview build deps
        if: matrix.platform == 'ubuntu-latest'
        uses: ./.github/actions/setup-rust
      - name: Rust stable (+ macOS cross-targets)
        if: matrix.platform != 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Rust cache
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: ". -> target"

      - name: Fast-fail Rust check for the installer feature set
        # The merge gate compiles default + clap-host but never plugin-host-juce,
        # so feature-gated Rust drift (e.g. a struct gaining fields) historically
        # surfaced only deep inside the tauri installer build. This check hits the
        # same compile first, before the web build and packaging, and reports the
        # plain compiler error; the shared rust-cache keeps the duplicate work
        # near-free on warm runs.
        shell: bash
        # --target matches the installer's actual Rust target (the macOS entries
        # cross-compile), so the check can't silently verify the host triple
        # while the installer builds a different one.
        run: cargo check -p ojhost --features juce --target "${{ matrix.piTarget }}"

      - name: Canari build config (version stamp + updater artifacts)
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/oj/release.ts stamp "${{ needs.prepare.outputs.version }}"
          tmp=$(mktemp)
          jq '.bundle.createUpdaterArtifacts = true' src-tauri/tauri.conf.json > "$tmp" \
            && mv "$tmp" src-tauri/tauri.conf.json

      # Build and sign in parallel, but do not let matrix jobs mutate the shared
      # GitHub Release. Parallel create/update/latest.json calls race and can
      # publish a partial release. The single publish job below owns all release
      # writes after every immutable workflow artifact is present.
      - name: Build + CANARI-sign (tauri-action)
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_CANARY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_CANARY }}
          OPENJAMMER_PI_TARGET: ${{ matrix.piTarget }}
          # VST2 is owner-provisioned only. Empty/default -> VST2 disabled;
          # provision both values before advertising VST2 in public installers.
          OJHOST_ENABLE_VST2: ${{ secrets.OJHOST_ENABLE_VST2 }}
          VST2_SDK_DIR: ${{ secrets.VST2_SDK_DIR }}
          VST3_SDK_DIR: ${{ secrets.VST3_SDK_DIR }}
          VITE_OJ_CANARY: 'true'
        with:
          projectPath: "."
          args: ${{ matrix.args }}
          uploadUpdaterJson: false

      - name: Build provenance subject list
        id: subjects
        if: ${{ steps.tauri.outputs.artifactPaths != '' }}
        shell: bash
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          {
            echo 'paths<<OJEOF'
            jq -r '.[]' <<< "$ARTIFACTS"
            echo 'OJEOF'
          } >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        if: ${{ steps.tauri.outputs.artifactPaths != '' }}
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

      - name: Preserve signed bundles for the single publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canari-${{ matrix.piTarget }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: |
            target/**/release/bundle/**/*.dmg
            target/**/release/bundle/**/*.app.tar.gz
            target/**/release/bundle/**/*.app.tar.gz.sig
            target/**/release/bundle/**/*.deb
            target/**/release/bundle/**/*.deb.sig
            target/**/release/bundle/**/*.AppImage
            target/**/release/bundle/**/*.AppImage.sig
            target/**/release/bundle/**/*-setup.exe
            target/**/release/bundle/**/*-setup.exe.sig

  publish:
    name: Publish complete canari release
    needs: [prepare, build]
    if: ${{ vars.CANARY_RELEASES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    env:
      CANARI_RELEASE_NOTES: "Canari build for the next stable line ${{ needs.prepare.outputs.base }}."
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Download every signed platform bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: canari-*
          path: canari-artifacts

      - name: Assemble and validate the release contract
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/oj/release-artifacts.ts assemble-canari \
            --input canari-artifacts \
            --output canari-publish \
            --version "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$TAG" \
            --notes "$CANARI_RELEASE_NOTES"

      - name: Upload atomically through one retrying publisher
        env:
          GH_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempt=1
            local max_attempts=5
            until "$@"; do
              if (( attempt >= max_attempts )); then
                echo "::error::Command failed after $attempt attempts: $*" >&2
                return 1
              fi
              local delay=$((attempt * attempt + RANDOM % 3))
              echo "::warning::Transient GitHub operation failed (attempt $attempt/$max_attempts); retrying in ${delay}s: $*" >&2
              sleep "$delay"
              attempt=$((attempt + 1))
            done
          }

          ensure_draft() {
            local draft
            draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq '.isDraft' 2>/dev/null || true)"
            if [ "$draft" = true ]; then
              return 0
            fi
            if [ "$draft" = false ]; then
              echo "::error::$TAG already exists as a published release" >&2
              return 1
            fi
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --prerelease \
              --title "OpenJammer Canari $TAG" \
              --notes "$CANARI_RELEASE_NOTES" >/dev/null
          }
          retry ensure_draft

          # Upload one file per retry boundary. A transient error can only replay
          # that idempotent asset, not every platform bundle or the whole build.
          while IFS= read -r -d '' asset; do
            retry gh release upload "$TAG" "$asset" \
              --repo "$GITHUB_REPOSITORY" --clobber </dev/null
          done < <(find canari-publish -maxdepth 1 -type f ! -name latest.json -print0 | sort -z)
          retry gh release upload "$TAG" canari-publish/latest.json \
            --repo "$GITHUB_REPOSITORY" --clobber

          find canari-publish -maxdepth 1 -type f -printf '%f\n' | sort > expected-assets.txt
          fetch_asset_names() {
            local attempt_file
            attempt_file="$(mktemp remote-assets.XXXXXX)"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' > "$attempt_file" || return 1
            mv "$attempt_file" remote-assets.raw
          }
          retry fetch_asset_names
          sort remote-assets.raw > uploaded-assets.txt
          if ! diff -u expected-assets.txt uploaded-assets.txt; then
            echo "::error::Draft release asset set differs from the locally validated contract"
            exit 1
          fi

          # Publication is the commit point: users cannot discover a partial
          # canari while the matrix builds or while transient uploads retry.
          retry gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease --title "OpenJammer Canari $TAG" \
            --notes "$CANARI_RELEASE_NOTES"
          fetch_release_state() {
            local attempt_file
            attempt_file="$(mktemp release-state.XXXXXX)"
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft,isPrerelease \
              --jq '[.isDraft, .isPrerelease] | @tsv' > "$attempt_file" || return 1
            mv "$attempt_file" release-state.txt
          }
          retry fetch_release_state
          state="$(<release-state.txt)"
          if [ "$state" != $'false\ttrue' ]; then
            echo "::error::$TAG was not published as a prerelease (state: $state)"
            exit 1
          fi
          echo "Complete canari release published."

  cleanup-reserved-tag:
    name: Cleanup reserved failed tag
    needs: [prepare, build, publish]
    if: ${{ always() && needs.prepare.outputs.tag != '' && (needs.build.result != 'success' || needs.publish.result != 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete reserved tag after failed canari publish
        env:
          GH_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || \
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
