name: Canari

# Numbered prereleases from the integration branch. If the next stable promotion
# will be v0.0.2, canari builds are v0.0.2-canari.1, v0.0.2-canari.2, ...

on:
  push:
    branches: [canari]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: canari-release
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ vars.CANARY_RELEASES_ENABLED == 'true' }}
    name: Prepare canari version
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.canari.outputs.base }}
      version: ${{ steps.canari.outputs.version }}
      tag: ${{ steps.canari.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Resolve promotion target
        id: stable
        env:
          GH_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(gh pr list --base main --head canari --state open \
            --json body --jq '.[0].body // ""')"
          target="$(printf '%s\n' "$body" \
            | sed -n 's/^oj-next-stable:[[:space:]]*//p' | head -1 || true)"
          if [ -n "$target" ]; then
            echo "version=$target" >> "$GITHUB_OUTPUT"
          else
            bun scripts/oj/release.ts next-stable --repo "${{ github.repository }}" \
              | tee stable.txt
            echo "version=$(cat stable.txt)" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next canari version
        id: canari
        env:
          GH_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/oj/release.ts next-canari \
            --repo "${{ github.repository }}" \
            --base "${{ steps.stable.outputs.version }}"

      - name: Reserve canari tag
        env:
          RELEASE_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.canari.outputs.tag }}" \
            -m "OpenJammer Canari ${{ steps.canari.outputs.tag }}"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${{ github.repository }}.git" \
            "${{ steps.canari.outputs.tag }}"

  build:
    name: Canari installers (${{ matrix.platform }})
    needs: prepare
    if: ${{ vars.CANARY_RELEASES_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin --features plugin-host-juce"
            piTarget: "aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin --features plugin-host-juce"
            piTarget: "x86_64-apple-darwin"
          - platform: ubuntu-latest
            args: "--features plugin-host-juce"
            piTarget: "x86_64-unknown-linux-gnu"
          - platform: windows-latest
            args: "--features plugin-host-juce"
            piTarget: "x86_64-pc-windows-msvc"
    runs-on: ${{ matrix.platform }}
    outputs:
      artifacts: ${{ steps.tauri.outputs.artifactPaths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Setup web (Bun + install)
        uses: ./.github/actions/setup-web
      - name: Linux webview build deps
        if: matrix.platform == 'ubuntu-latest'
        uses: ./.github/actions/setup-rust
      - name: Rust stable (+ macOS cross-targets)
        if: matrix.platform != 'ubuntu-latest'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Rust cache
        uses: Swatinem/rust-cache@a45951ff880207c249adf57334cf2e9bd81d6e1e # v2
        with:
          workspaces: ". -> target"

      - name: Canari build config (version stamp + updater artifacts)
        shell: bash
        run: |
          set -euo pipefail
          bun scripts/oj/release.ts stamp "${{ needs.prepare.outputs.version }}"
          tmp=$(mktemp)
          jq '.bundle.createUpdaterArtifacts = true' src-tauri/tauri.conf.json > "$tmp" \
            && mv "$tmp" src-tauri/tauri.conf.json

      - name: Build + CANARI-sign + publish (tauri-action)
        id: tauri
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_CANARY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD_CANARY }}
          OPENJAMMER_PI_TARGET: ${{ matrix.piTarget }}
          # VST2 is owner-provisioned only. Empty/default -> VST2 disabled;
          # provision both values before advertising VST2 in public installers.
          OJHOST_ENABLE_VST2: ${{ secrets.OJHOST_ENABLE_VST2 }}
          VST2_SDK_DIR: ${{ secrets.VST2_SDK_DIR }}
          VST3_SDK_DIR: ${{ secrets.VST3_SDK_DIR }}
          VITE_OJ_CANARY: 'true'
        with:
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: "OpenJammer Canari ${{ needs.prepare.outputs.tag }}"
          releaseBody: "Canari build for the next stable line ${{ needs.prepare.outputs.base }}."
          releaseDraft: false
          prerelease: true
          projectPath: "."
          args: ${{ matrix.args }}

      - name: Build provenance subject list
        id: subjects
        if: ${{ steps.tauri.outputs.artifactPaths != '' }}
        shell: bash
        env:
          ARTIFACTS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          {
            echo 'paths<<OJEOF'
            jq -r '.[]' <<< "$ARTIFACTS"
            echo 'OJEOF'
          } >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        if: ${{ steps.tauri.outputs.artifactPaths != '' }}
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.subjects.outputs.paths }}

  manifest-gate:
    name: All-platform signature gate
    needs: [prepare, build]
    if: ${{ vars.CANARY_RELEASES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert every platform key is present in latest.json
        env:
          GH_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          asset_url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | select(.name=="latest.json") | .url' || true)
          if [ -z "${asset_url:-}" ]; then
            echo "::error::$TAG latest.json was not published"; exit 1
          fi
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "$asset_url" -o latest.json
          for plat in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            if ! jq -e ".platforms[\"$plat\"].signature | length > 0" latest.json >/dev/null; then
              echo "::error::latest.json is missing a signature for $plat"; exit 1
            fi
          done
          echo "All four platform signatures present in the canari manifest."

  cleanup-reserved-tag:
    name: Cleanup reserved failed tag
    needs: [prepare, build, manifest-gate]
    if: ${{ failure() && needs.prepare.outputs.tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Delete reserved tag after failed canari publish
        env:
          GH_TOKEN: ${{ secrets.OJ_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || \
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" || true
