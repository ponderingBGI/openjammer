name: setup-rust
description: >
  System deps + the pinned Rust toolchain(s) + cargo cache — the shared engine
  setup, so the per-PR CI, the nightly Lane B, and the release/canary workflows
  all build the engine the SAME way (DRY: collapse the repeated apt/toolchain/
  cache blocks).

inputs:
  nightly:
    description: Also install the nightly toolchain + wasm32 target (the wasm/no_std legs).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: System deps (Tauri + cpal + JUCE plugin hosting)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          libasound2-dev \
          libfreetype6-dev \
          libfontconfig1-dev \
          libx11-dev \
          libxext-dev \
          libxinerama-dev \
          libxrandr-dev \
          libxcursor-dev \
          libgl1-mesa-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev \
          librsvg2-dev
    # nightly FIRST (only the wasm leg uses `cargo +nightly`), stable LAST so
    # stable stays the DEFAULT toolchain for fmt/clippy/test/build.
    - name: Rust nightly (wasm leg)
      if: inputs.nightly == 'true'
      # SHA-pinned (supply-chain); `toolchain:` is REQUIRED once pinned because the
      # channel can no longer be read from the `@nightly` ref name. Dependabot bumps
      # the pin (preserving the `# nightly` comment).
      uses: dtolnay/rust-toolchain@5b842231ba77f5c045dba54ac5560fed2db780e2 # nightly
      with:
        toolchain: nightly
        components: rust-src
        targets: wasm32-unknown-unknown
    - name: Rust stable (default; fmt, clippy)
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
