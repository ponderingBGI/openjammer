name: setup-rust
description: >
  System deps + the pinned Rust toolchain(s) + cargo cache — the shared engine
  setup, so the per-PR CI, the nightly Lane B, and the release/canary workflows
  all build the engine the SAME way (DRY: collapse the repeated apt/toolchain/
  cache blocks).

inputs:
  nightly:
    description: Also install the nightly toolchain + wasm32 target (the wasm/no_std legs).
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: System deps (ALSA for cpal + GTK/WebKit for the Tauri crate)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev \
          librsvg2-dev
    # nightly FIRST (only the wasm leg uses `cargo +nightly`), stable LAST so
    # stable stays the DEFAULT toolchain for fmt/clippy/test/build.
    - name: Rust nightly (wasm leg)
      if: inputs.nightly == 'true'
      uses: dtolnay/rust-toolchain@nightly
      with:
        components: rust-src
        targets: wasm32-unknown-unknown
    - name: Rust stable (default; fmt, clippy)
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
