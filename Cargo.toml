[workspace]
resolver = "2"
# `crates/*` are the engine crates; `src-tauri` is the native desktop shell
# (U22) — a workspace member so it shares the pinned deps + one Cargo.lock.
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2021"
# Single version SSOT — written in lockstep by release-please (the single version
# brain) across all four files: Cargo.toml, package.json, tauri.conf.json,
# packages/oj-protocol-ts/package.json. See release-please-config.json. Do not
# hand-edit out of lockstep; `oj doctor --check version-sync` asserts equality.
version = "0.1.0-alpha.2"
license = "AGPL-3.0-only"

# Pinned from a fresh cargo at scaffold time (governing principle #9).
[workspace.dependencies]
serde = { version = "1.0.228", default-features = false, features = ["derive", "alloc"] }
libm = "0.2"

# Keep release builds tight + deny accidental panics-as-control-flow later.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
